codecov:
  notify:
    # 8 frontend + 8 backend shard uploads (see run-*-unit-tests-shards in dockerbuild-ci.yml). Waiting for all of
    # them keeps a partial upload from posting a failing patch status. Keep in sync with the shard matrices.
    after_n_builds: 16

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# The lines a pull request changes must be at least 80% covered, checked separately for each app. Informational, so
# codecov/patch/<app> never fails: the coverage job of dockerbuild-ci.yml checks the same rules from the Vitest reports
# and is the one that fails the pull request. Keep both in sync.
component_management:
  individual_components:
    - component_id: frontend
      name: frontend
      paths:
        - apps/frontend/**
      statuses:
        - type: patch
          target: 80%
          informational: true
    - component_id: backend
      name: backend
      paths:
        - apps/backend/**
      statuses:
        - type: patch
          target: 80%
          informational: true

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: true
