name: 'Project dates'
description: >
  Writes the task tracking dates on the XTM Hub project items of the issues a pull request or a release carries:
  `start` sets Dev start date when it is empty and alerts when Planned ETA is empty; `merge`
  sets Adjusted ETA (the latest merge wins); `release` sets Prod date and moves the tasks in Ready to Deploy to Done.
  Needs a token able to write the organization project (the project GitHub App token), and a checkout of
  `.github/actions/project-dates` from the default branch.
inputs:
  event:
    description: 'start, merge or release.'
    required: true
  token:
    description: 'Token allowed to write the organization project.'
    required: true
  issues:
    description: 'Comma separated issue numbers (start and merge).'
    required: false
    default: ''
  pr-number:
    description: 'Pull request number, sent with the alerts (start and merge).'
    required: false
    default: ''
  pr-url:
    description: 'Pull request URL, sent with the alerts (start and merge).'
    required: false
    default: ''
  pr-author:
    description: 'Pull request author, sent with the alerts (start and merge).'
    required: false
    default: ''
  tag:
    description: 'Release tag (release).'
    required: false
    default: ''
  previous-tag:
    description: 'Release tag before it (release).'
    required: false
    default: ''
  webhook-url:
    description: >
      n8n webhook that receives every alert (missing Planned ETA, field or status not found, update failed...) as a
      JSON body. n8n decides what to do with it, Teams included. Empty means alerts only show as annotations.
    required: false
    default: ''
  organization:
    description: 'Organization owning the project.'
    required: false
    default: 'XTM-Hub'
  project-number:
    description: 'Number of the project.'
    required: false
    default: '1'
runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc

    - name: Write the dates
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ORGANIZATION: ${{ inputs.organization }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        ALERT_WEBHOOK_URL: ${{ inputs.webhook-url }}
        EVENT: ${{ inputs.event }}
        ISSUES: ${{ inputs.issues }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_URL: ${{ inputs.pr-url }}
        PR_AUTHOR: ${{ inputs.pr-author }}
        TAG: ${{ inputs.tag }}
        PREVIOUS_TAG: ${{ inputs.previous-tag }}
      run: |
        node "${GITHUB_ACTION_PATH}/project-dates.mjs" --event "$EVENT" --issues "$ISSUES" \
          --pr-number "$PR_NUMBER" --pr-url "$PR_URL" --pr-author "$PR_AUTHOR" \
          --tag "$TAG" --previous-tag "$PREVIOUS_TAG"
