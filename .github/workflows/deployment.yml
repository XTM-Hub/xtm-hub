name: Create Deployment

on:
  workflow_dispatch:
    inputs:
      bump_major:
        description: "Bump the MAJOR version number"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute new version (MAJOR.YYMMDD.SEQ)
        run: |
          # Determine current major from the latest tag
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT_MAJOR=1
          else
            CURRENT_MAJOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f1)
          fi

          if [ "${{ github.event.inputs.bump_major }}" == "true" ]; then
            MAJOR=$((CURRENT_MAJOR + 1))
          else
            MAJOR=$CURRENT_MAJOR
          fi

          YYMMDD=$(date -u +%y%m%d)

          SEQ=0
          for tag in $(git tag -l "v${MAJOR}.${YYMMDD}.*"); do
            TAG_SEQ=$(echo "$tag" | cut -d. -f3)
            if [ "$TAG_SEQ" -ge "$SEQ" ]; then
              SEQ=$((TAG_SEQ + 1))
            fi
          done

          NEW_VERSION="${MAJOR}.${YYMMDD}.${SEQ}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "✅ Computed version: $NEW_VERSION"

      - name: Create and push tag
        run: |
          git tag "v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}"

      - name: Store release requested event
        env:
          N8N_DELIVERY_FILE_WRITER_URL: ${{ secrets.N8N_DELIVERY_FILE_WRITER_URL }}
          N8N_DELIVERY_WEBHOOK_TOKEN: ${{ secrets.N8N_DELIVERY_WEBHOOK_TOKEN }}
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SHA=$(git rev-parse HEAD)
          TAG_NAME="v${{ env.NEW_VERSION }}"
          DEPLOYMENT_KEY="${{ github.repository }}:production:${TAG_NAME}"

          curl -sS -X POST "$N8N_DELIVERY_FILE_WRITER_URL" \
            -H "Content-Type: application/json" \
            -H "x-delivery-token: $N8N_DELIVERY_WEBHOOK_TOKEN" \
            -d @- <<EOF || true
          {
            "category": "deployments",
            "event_type": "release_requested",
            "occurred_at": "$NOW",
            "payload": {
              "deployment_key": "$DEPLOYMENT_KEY",
              "repository": "${{ github.repository }}",
              "environment": "production",
              "version": "$TAG_NAME",
              "sha": "$SHA",
              "status": "requested",
              "requested_at": "$NOW",
              "workflow": "${{ github.workflow }}",
              "github_run_id": "${{ github.run_id }}",
              "github_run_attempt": "${{ github.run_attempt }}",
              "actor": "${{ github.actor }}"
            }
          }
          EOF

      - name: Trigger Docker Build Workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering dockerbuild-ci workflow..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/dockerbuild-ci.yml/dispatches \
            -d '{"ref":"v${{ env.NEW_VERSION }}"}'
          echo "✅ Docker build workflow triggered successfully"

      - name: Send n8n Webhook Notification
        run: |
          echo "Sending n8n webhook notification..."
          response=$(curl -X POST \
            -w "\n%{http_code}" \
            -o /tmp/webhook_response.txt \
            "${{ secrets.N8N_NOTIF_DEPLOYMENT_WEBHOOK }}?version=v${{ env.NEW_VERSION }}&status=requested")
          
          http_code=$(echo "$response" | tail -n1)
          response_body=$(cat /tmp/webhook_response.txt)
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Webhook notification sent successfully (HTTP $http_code)"
            echo "Response: $response_body"
          else
            echo "⚠️ Webhook notification failed (HTTP $http_code)"
            echo "Response: $response_body"
            # Optionally fail the workflow if webhook is critical
            # exit 1
          fi

      # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
      # documentation deployment is dispatched explicitly for the new tag.
      - name: Trigger Documentation Deployment Workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering docs-deploy workflow..."
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/docs-deploy.yml/dispatches \
            -d '{"ref":"v${{ env.NEW_VERSION }}","inputs":{"tag":"v${{ env.NEW_VERSION }}"}}'
          echo "✅ Documentation deployment workflow triggered successfully"

      - name: Summary
        run: |
          echo "## Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version:** v${{ env.NEW_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Major Bumped:** ${{ github.event.inputs.bump_major }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Format:** MAJOR.YYMMDD.SEQ" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Created:** v${{ env.NEW_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Workflow:** Triggered automatically" >> $GITHUB_STEP_SUMMARY
          echo "- **Documentation Workflow:** Triggered automatically (skipped if \`docs/\` is unchanged)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment has been successfully created and the Docker build and documentation workflows have been triggered." >> $GITHUB_STEP_SUMMARY
