---

name: Restore anonymized data on a test env
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
#      The XTM Hub namespace on staging environment
      namespace:
        description: 'xtmhub, xtmhub-dev, xtmhub-prerelease or xtmhub-dev-pr-[PR Number] for feature branch'
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.namespace }}
  cancel-in-progress: true

jobs:
  restore-anonymized-data:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout AWX action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/awx-launch
      - name: Restore anonymized data
        uses: ./.github/actions/awx-launch
        with:
          template: Restore XTM Hub prod anonymized data
          inventory: eu-west-staging
          extra-vars: '{"ns":"${{ inputs.namespace }}"}'
          token: ${{ secrets.AWX_TOKEN }}
