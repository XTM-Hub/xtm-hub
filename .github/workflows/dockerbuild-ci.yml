name: Run XTM Hub CI/CD

on:
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - "main"
    paths:
      - "apps/**"
      - ".github/workflows/dockerbuild-ci.yml"
      - "package.json"
      - "yarn.lock"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "issue/*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "apps/**"
              - ".github/workflows/dockerbuild-ci.yml"
              - "package.json"
              - "yarn.lock"

  run-lint:
    name: Check quality ${{ matrix.label }}
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: backend
            working-directory: apps/backend
          - label: frontend
            working-directory: apps/frontend
          - label: e2e
            working-directory: apps/e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run lint
        working-directory: ${{ matrix.working-directory }}
        run: yarn lint

      - name: Check formatting
        working-directory: ${{ matrix.working-directory }}
        run: yarn format:check

      - name: yarn i18n-check
        if: matrix.label == 'frontend'
        working-directory: ${{ matrix.working-directory }}
        run: |
          yarn i18n:check

      - name: Husky setup reminder
        if: failure()
        run: |
          echo "::warning::This should have been caught locally by the Husky pre-commit hook."
          echo "::warning::Since enableScripts is disabled in .yarnrc.yml, Husky is not set up automatically."
          echo "::warning::Run 'yarn workspace @xtm-hub/backend prepare' to install the git hooks."

  build-images-tests:
    needs:
      - detect-changes
    if: needs.detect-changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: portal-front
            dockerfile: apps/frontend/Dockerfile
          - image: portal-api
            dockerfile: apps/backend/Dockerfile
          - image: portal-e2e-tests
            dockerfile: apps/e2e/Dockerfile
          - image: portal-front-test
            dockerfile: apps/frontend/test.Dockerfile
          - image: portal-api-test
            dockerfile: apps/backend/test.Dockerfile
    outputs:
      docker-tags: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
      docker-labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup Docker layer cache
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.image }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.image }}-
            ${{ runner.os }}-buildx-

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta deps
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: filigran/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Copy migrations
        run: |
          cp -r ./apps/backend/src/migrations ./apps/e2e/migrations
          cp -r ./apps/backend/tests/seeds ./apps/e2e/seeds
          cp ./apps/backend/tests/test-utils.ts ./apps/e2e/test-utils.ts

      - name: Build and push portal image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=0.0.0-e2e
          cache-from: |
            type=local,src=/tmp/.buildx-cache
            type=registry,ref=filigran/${{ matrix.image }}:main
            type=registry,ref=filigran/${{ matrix.image }}:cache-${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          cache-to: |
            type=local,dest=/tmp/.buildx-cache-new,mode=max
            type=registry,ref=filigran/${{ matrix.image }}:cache-${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }},mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  run-e2e-tests-shards:
    needs: build-images-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install docker
        uses: docker/setup-docker-action@v5

      - name: Copy migrations
        run: |
          cp -r ./apps/backend/src/migrations ./apps/e2e/migrations
          cp -r ./apps/backend/tests/seeds ./apps/e2e/seeds
          cp ./apps/backend/tests/test-utils.ts ./apps/e2e/test-utils.ts

      - name: Pull docker images
        uses: ./.github/actions/retry-with-backoff
        env:
          IMAGE_TAGS: ${{ needs.build-images-tests.outputs.docker-tags }}
        with:
          command: docker compose -f ./xtm-hub-dev/docker-compose-ci.yml pull --include-deps e2e

      - name: Launch docker compose
        run: |
          mkdir -p ctrf
          export IMAGE_TAGS="${{ needs.build-images-tests.outputs.docker-tags }}" \
           TEAMS_WEBHOOK_E2E="${{ secrets.TEAMS_WEBHOOK_E2E }}" \
           GITHUB_PR_TITLE="${{ github.event.pull_request.title }}" \
           GITHUB_PR_NUMBER="${{ github.event.pull_request.number }}" \
           GITHUB_RUN_ID="${{ github.run_id }}" \
           PLAYWRIGHT_SHARD="${{ matrix.shard }}/8"
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml run \
           -e PLAYWRIGHT_SHARD \
           e2e sh -lc "yarn test:e2e --shard=${PLAYWRIGHT_SHARD}" || TEST_EXIT_CODE=$?
          CONTAINER_ID=$(docker ps -a --filter "name=e2e-run" --format "{{.ID}}" | head -1)
          docker cp $CONTAINER_ID:/app/apps/e2e/ctrf/. ./ctrf/
          exit ${TEST_EXIT_CODE:-0}

      - name: Upload CTRF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctrf-shard-${{ matrix.shard }}
          path: ctrf/
          retention-days: 30

      - name: Collect service logs on failure
        if: failure()
        run: |
          echo "=== Collecting logs from all services ==="
          echo ""
          echo "=== Backend Logs ==="
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs --tail=100 backend || echo "Could not collect backend logs"
          echo ""
          echo "=== Portal API Test Logs ==="
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs --tail=100 backend-test || echo "Could not collect backend-test logs"
          echo ""
          echo "=== Frontend Logs ==="
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs --tail=100 frontend || echo "Could not collect frontend logs"
          echo ""
          echo "=== Frontend Test Logs ==="
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs --tail=100 frontend-test || echo "Could not collect frontend-test logs"
          echo ""
          echo "=== PostgreSQL Logs ==="
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs --tail=100 portal-postgres || echo "Could not collect portal-postgres logs"
          echo ""
          echo "=== MinIO Logs ==="
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs --tail=100 portal-minio || echo "Could not collect portal-minio logs"
          echo ""
          echo "=== E2E Tests Logs ==="
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs --tail=100 e2e || echo "Could not collect e2e logs"
          echo ""
          echo "=== Docker container status ==="
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml ps -a || echo "Could not get container status"

      - name: Save logs as artifacts
        if: failure()
        run: |
          mkdir -p logs
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs backend > logs/backend.log 2>&1 || true
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs backend-test > logs/backend-test.log 2>&1 || true
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs frontend > logs/frontend.log 2>&1 || true
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs frontend-test > logs/frontend-test.log 2>&1 || true
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs portal-postgres > logs/portal-postgres.log 2>&1 || true
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs portal-minio > logs/portal-minio.log 2>&1 || true
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml logs e2e > logs/e2e.log 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: service-logs-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: logs/
          retention-days: 30

  run-front-unit-tests-shards:
    needs: build-images-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
      packages: write
    if: contains(github.ref , 'refs/tags/') == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install docker
        uses: docker/setup-docker-action@v5

      - name: Pull docker image
        uses: ./.github/actions/retry-with-backoff
        with:
          command: docker pull filigran/portal-front-test:${{ needs.build-images-tests.outputs.docker-tags }}

      - name: Run front unit tests
        run: |
          export IMAGE_TAGS="${{ needs.build-images-tests.outputs.docker-tags }}" \
            VITEST_SHARD="${{ matrix.shard }}/8"
          mkdir -p coverage
          docker run --rm \
            -e VITEST_SHARD \
            -v $(pwd)/coverage:/app/apps/frontend/coverage \
            filigran/portal-front-test:${IMAGE_TAGS} \
            sh -lc "yarn vitest run --shard=${VITEST_SHARD} --coverage --coverage.clean=false"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          flags: frontend-shard-${{ matrix.shard }}
          name: frontend-shard-${{ matrix.shard }}
          token: ${{ secrets.CODECOV_TOKEN }}

  run-api-unit-tests-shards:
    needs: build-images-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
      packages: write
    if: contains(github.ref , 'refs/tags/') == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install docker
        uses: docker/setup-docker-action@v5

      - name: Pull docker images
        uses: ./.github/actions/retry-with-backoff
        env:
          IMAGE_TAGS: ${{ needs.build-images-tests.outputs.docker-tags }}
        with:
          command: docker compose -f ./xtm-hub-dev/docker-compose-ci.yml pull --include-deps backend-test

      - name: Run backend type-check
        if: matrix.shard == 1
        run: |
          export IMAGE_TAGS=${{ needs.build-images-tests.outputs.docker-tags }}
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml run \
            backend-test sh -lc "yarn check-ts"

      - name: Launch docker compose
        run: |
          mkdir -p coverage
          export IMAGE_TAGS="${{ needs.build-images-tests.outputs.docker-tags }}" \
            VITEST_SHARD="${{ matrix.shard }}/8"
          docker compose -f ./xtm-hub-dev/docker-compose-ci.yml run \
            -e VITEST_SHARD \
            backend-test sh -lc "VITEST_MODE=true yarn vitest run --shard=${VITEST_SHARD} --coverage --coverage.clean=false"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          flags: backend-shard-${{ matrix.shard }}
          name: backend-shard-${{ matrix.shard }}
          token: ${{ secrets.CODECOV_TOKEN }}

  run-e2e-tests:
    needs:
      - run-e2e-tests-shards
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Finalize e2e shards
        run: |
          if [ "${{ needs.run-e2e-tests-shards.result }}" != "success" ] && [ "${{ needs.run-e2e-tests-shards.result }}" != "skipped" ]; then
            echo "E2E shard job failed with result: ${{ needs.run-e2e-tests-shards.result }}"
            exit 1
          fi

      - name: Download CTRF artifacts
        if: always() && needs.run-e2e-tests-shards.result != 'skipped'
        uses: actions/download-artifact@v5
        with:
          pattern: ctrf-shard-*
          path: ctrf
          merge-multiple: false

      - name: Publish Test Report
        if: always() && needs.run-e2e-tests-shards.result != 'skipped'
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: "./ctrf/**/*.json"
          pull-request: true
          summary-report: true
          failed-report: true
          flaky-report: true
          insights-report: true
          suite-folded-report: true
          overwrite-comment: true
          report-order: "summary-report,failed-report,flaky-report,insights-report,test-report"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-front-unit-tests:
    needs: run-front-unit-tests-shards
    if: always() && contains(github.ref , 'refs/tags/') == false
    runs-on: ubuntu-latest
    steps:
      - name: Finalize frontend shards
        run: |
          if [ "${{ needs.run-front-unit-tests-shards.result }}" != "success" ] && [ "${{ needs.run-front-unit-tests-shards.result }}" != "skipped" ]; then
            echo "Frontend shard job failed with result: ${{ needs.run-front-unit-tests-shards.result }}"
            exit 1
          fi

  run-api-unit-tests:
    needs: run-api-unit-tests-shards
    if: always() && contains(github.ref , 'refs/tags/') == false
    runs-on: ubuntu-latest
    steps:
      - name: Finalize backend shards
        run: |
          if [ "${{ needs.run-api-unit-tests-shards.result }}" != "success" ] && [ "${{ needs.run-api-unit-tests-shards.result }}" != "skipped" ]; then
            echo "Backend shard job failed with result: ${{ needs.run-api-unit-tests-shards.result }}"
            exit 1
          fi

  deploy-feature-branch:
    needs: build-images-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: |
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-feature-env')
    steps:
      - name: Install AWX cli
        run: pip install awxkit

      - name: Prepare deployment metadata
        if: contains(github.ref, 'refs/tags/')
        id: deployment_metadata
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION=$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')
          DEPLOYMENT_KEY="${{ github.repository }}:production:${TAG_NAME}"
          echo "started_at=$NOW" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "deployment_key=$DEPLOYMENT_KEY" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: ./.github/actions/retry-with-backoff
        with:
          command: |
            awx --conf.host https://awx.filigran.io \
              --conf.token ${{ secrets.AWX_TOKEN }} \
              -f human job_templates launch 'Deploy XTM Hub feature branch for testing' \
              --inventory eu-west-staging \
              --extra_vars "{\"env\":\"Development\",\"xtmhub_version\":\"pr-${{ github.event.number }}\",\"xtmhub_node_env\":\"development\"}"

  build-images-prod:
    needs:
      - run-lint
      - run-e2e-tests
      - run-front-unit-tests
      - run-api-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: portal-front
            dockerfile: apps/frontend/Dockerfile
          - image: portal-api
            dockerfile: apps/backend/Dockerfile
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      (needs.run-lint.result == 'success') &&
      (needs.run-e2e-tests.result == 'success') &&
      (needs.run-front-unit-tests.result == 'skipped' || needs.run-front-unit-tests.result == 'success') &&
      (needs.run-api-unit-tests.result == 'skipped' || needs.run-api-unit-tests.result == 'success')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup Docker layer cache
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-prod-${{ matrix.image }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-prod-${{ matrix.image }}-
            ${{ runner.os }}-buildx-${{ matrix.image }}-
            ${{ runner.os }}-buildx-

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta deps
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: filigran/${{ matrix.image }}-prod
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            ${{ contains(github.ref, 'refs/tags/') && 'latest' }}
            ${{ github.ref == 'refs/heads/main' && 'type=raw,value=development' || '' }}

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "VERSION=rolling-${GITHUB_SHA::8}" >> $GITHUB_ENV
          else
            echo "VERSION=local-${GITHUB_SHA::8}" >> $GITHUB_ENV
          fi

      - name: Build and push images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=local,src=/tmp/.buildx-cache
            type=registry,ref=filigran/${{ matrix.image }}:main
            type=registry,ref=filigran/${{ matrix.image }}:latest
            type=registry,ref=filigran/${{ matrix.image }}:${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    needs: build-images-prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      (needs.build-images-prod.result == 'success')
    steps:
      - name: Install AWX cli
        run: pip install awxkit

      - name: Store deployment started event
        if: contains(github.ref, 'refs/tags/')
        env:
          N8N_DELIVERY_FILE_WRITER_URL: ${{ secrets.N8N_DELIVERY_FILE_WRITER_URL }}
          N8N_DELIVERY_WEBHOOK_TOKEN: ${{ secrets.N8N_DELIVERY_WEBHOOK_TOKEN }}
        run: |
          curl -sS -X POST "$N8N_DELIVERY_FILE_WRITER_URL" \
            -H "Content-Type: application/json" \
            -H "x-delivery-token: $N8N_DELIVERY_WEBHOOK_TOKEN" \
            -d @- <<EOF || true
          {
            "category": "deployments",
            "event_type": "deployment_started",
            "occurred_at": "${{ steps.deployment_metadata.outputs.started_at }}",
            "payload": {
              "deployment_key": "${{ steps.deployment_metadata.outputs.deployment_key }}",
              "repository": "${{ github.repository }}",
              "environment": "production",
              "version": "${{ steps.deployment_metadata.outputs.tag_name }}",
              "sha": "${{ github.sha }}",
              "status": "in_progress",
              "started_at": "${{ steps.deployment_metadata.outputs.started_at }}",
              "workflow": "${{ github.workflow }}",
              "github_run_id": "${{ github.run_id }}",
              "github_run_attempt": "${{ github.run_attempt }}",
              "actor": "${{ github.actor }}"
            }
          }
          EOF

      - name: Deploy on Production
        id: awx_production_deploy
        if: contains(github.ref, 'refs/tags/')
        uses: ./.github/actions/retry-with-backoff
        with:
          command: |
            export VERSION=$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')
            awx --conf.host https://awx.filigran.io \
              --conf.token ${{ secrets.AWX_TOKEN }} \
              -f human job_templates launch 'Deploy XTM Hub' \
              --inventory eu-west-production \
              --extra_vars "{\"env\":\"Production\",\"xtmhub_version\":\"$VERSION\"}"

      - name: Send n8n Webhook Notification
        if: contains(github.ref, 'refs/tags/')
        run: |
          echo "Sending n8n webhook notification..."
          response=$(curl -X POST \
            -w "\n%{http_code}" \
            -o /tmp/webhook_response.txt \
            "${{ secrets.N8N_NOTIF_DEPLOYMENT_WEBHOOK }}?version=${GITHUB_REF_NAME}&status=completed")

          http_code=$(echo "$response" | tail -n1)
          response_body=$(cat /tmp/webhook_response.txt)

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Webhook notification sent successfully (HTTP $http_code)"
            echo "Response: $response_body"
          else
            echo "⚠️ Webhook notification failed (HTTP $http_code)"
            echo "Response: $response_body"
          fi

      - name: Store deployment completed event
        if: contains(github.ref, 'refs/tags/') && success()
        env:
          N8N_DELIVERY_FILE_WRITER_URL: ${{ secrets.N8N_DELIVERY_FILE_WRITER_URL }}
          N8N_DELIVERY_WEBHOOK_TOKEN: ${{ secrets.N8N_DELIVERY_WEBHOOK_TOKEN }}
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl -sS -X POST "$N8N_DELIVERY_FILE_WRITER_URL" \
            -H "Content-Type: application/json" \
            -H "x-delivery-token: $N8N_DELIVERY_WEBHOOK_TOKEN" \
            -d @- <<EOF || true
          {
            "category": "deployments",
            "event_type": "deployment_completed",
            "occurred_at": "$NOW",
            "payload": {
              "deployment_key": "${{ steps.deployment_metadata.outputs.deployment_key }}",
              "repository": "${{ github.repository }}",
              "environment": "production",
              "version": "${{ steps.deployment_metadata.outputs.tag_name }}",
              "sha": "${{ github.sha }}",
              "status": "completed",
              "completed_at": "$NOW",
              "workflow": "${{ github.workflow }}",
              "github_run_id": "${{ github.run_id }}",
              "github_run_attempt": "${{ github.run_attempt }}",
              "actor": "${{ github.actor }}"
            }
          }
          EOF

      - name: Store deployment failed event
        if: contains(github.ref, 'refs/tags/') && failure()
        env:
          N8N_DELIVERY_FILE_WRITER_URL: ${{ secrets.N8N_DELIVERY_FILE_WRITER_URL }}
          N8N_DELIVERY_WEBHOOK_TOKEN: ${{ secrets.N8N_DELIVERY_WEBHOOK_TOKEN }}
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          curl -sS -X POST "$N8N_DELIVERY_FILE_WRITER_URL" \
            -H "Content-Type: application/json" \
            -H "x-delivery-token: $N8N_DELIVERY_WEBHOOK_TOKEN" \
            -d @- <<EOF || true
          {
            "category": "deployments",
            "event_type": "deployment_failed",
            "occurred_at": "$NOW",
            "payload": {
              "deployment_key": "${{ steps.deployment_metadata.outputs.deployment_key }}",
              "repository": "${{ github.repository }}",
              "environment": "production",
              "version": "${{ steps.deployment_metadata.outputs.tag_name }}",
              "sha": "${{ github.sha }}",
              "status": "failed",
              "failed_at": "$NOW",
              "workflow": "${{ github.workflow }}",
              "github_run_id": "${{ github.run_id }}",
              "github_run_attempt": "${{ github.run_attempt }}",
              "actor": "${{ github.actor }}"
            }
          }
          EOF

      - name: Deploy on Development
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/retry-with-backoff
        with:
          command: |
            awx --conf.host https://awx.filigran.io \
              --conf.token ${{ secrets.AWX_TOKEN }} \
              -f human job_templates launch 'Deploy XTM Hub' \
              --inventory eu-west-staging \
              --extra_vars '{"env":"Development"}'

      - name: Deploy on Prerelease
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/retry-with-backoff
        with:
          command: |
            awx --conf.host https://awx.filigran.io \
              --conf.token ${{ secrets.AWX_TOKEN }} \
              -f human job_templates launch 'Deploy XTM Hub' \
              --inventory eu-west-staging \
              --extra_vars '{"env":"Prerelease"}'

  # Notifies the team channel when CI fails on a protected branch (main/development)
  # or in the merge queue. Regular PR-branch CI failures are intentionally excluded,
  # since those are expected to be worked on by the PR author and don't indicate a
  # broken mainline/merge-queue state.
  notify-on-failure:
    name: Notify team on CI failure (mainline / merge queue)
    needs:
      - detect-changes
      - run-lint
      - build-images-tests
      - run-e2e-tests-shards
      - run-e2e-tests
      - run-front-unit-tests-shards
      - run-front-unit-tests
      - run-api-unit-tests-shards
      - run-api-unit-tests
      - build-images-prod
      - deploy
    if: |
      always() &&
      contains(needs.*.result, 'failure') &&
      (
        github.event_name == 'merge_group' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send Teams notification on CI failure
        env:
          TEAMS_WEBHOOK_CI_FAILURE: ${{ secrets.TEAMS_WEBHOOK_CI_FAILURE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_CI_FAILURE" ]; then
            echo "⚠️ TEAMS_WEBHOOK_CI_FAILURE secret is not set, skipping notification"
            exit 0
          fi

          if [ "$EVENT_NAME" = "merge_group" ]; then
            TRIGGER="the merge queue"
          else
            TRIGGER="a push to $REF_NAME"
          fi

          curl -sS -X POST "$TEAMS_WEBHOOK_CI_FAILURE" \
            -H "Content-Type: application/json" \
            -d @- <<EOF || true
          {
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "size": "medium",
                      "weight": "bolder",
                      "color": "attention",
                      "text": "🚨 CI failed on $TRIGGER",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "Workflow $WORKFLOW_NAME failed for $REPO (commit $COMMIT_SHA).",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "[View failed run]($RUN_URL)",
                      "weight": "bolder",
                      "wrap": true
                    }
                  ]
                }
              }
            ]
          }
          EOF
