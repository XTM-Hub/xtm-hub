name: PR and Issue Status Management
on:
  pull_request:
    types: [opened, edited, ready_for_review, converted_to_draft, closed]
    branches:
      - main
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [labeled, unlabeled]
  workflow_run:
    workflows: ["Run XTM Hub CI/CD"]
    types: [completed]
env:
  ORGANIZATION: "XTM-Hub"
  PROJECT_NUMBER: 1
jobs:
  manage-pr-and-issues:
    runs-on: ubuntu-26.04
    outputs:
      pr_number: ${{ steps.extract_issues.outputs.pr_number }}
      should_deploy: ${{ steps.check_feature_env.outputs.result }}
    permissions:
      issues: write
      pull-requests: write
      contents: read
      repository-projects: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.FILIGRANHQ_PROJECT_APP_ID }}
          private-key: ${{ secrets.FILIGRANHQ_PROJECT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Assign PR to creator
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prCreator = context.payload.pull_request.user.login;
            console.log(`Assigning PR to creator: ${prCreator}`);

            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: [prCreator]
              });
              console.log(`✅ Successfully assigned PR to ${prCreator}`);
            } catch (error) {
              console.error(`Failed to assign PR to ${prCreator}:`, error);
            }

      - name: Check if creator is in the organization
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        id: check_org_membership
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.orgs.checkMembershipForUser({
                org: process.env.ORGANIZATION,
                username: context.payload.pull_request.user.login
              });
              return true;
            } catch (error) {
              if (error.status === 404) {
                return false;
              }
              throw error;
            }

      - name: Add Filigran Team label
        if: steps.check_org_membership.outputs.result == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['Filigran Team']
            });

      - name: Extract issue numbers from PR body and title
        id: extract_issues
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let pullRequest = null;
            let prNumber = null;

            // Handle different event types
            if (context.eventName === 'workflow_run') {
              // For workflow_run events, fetch PR data from the workflow run
              const workflowRun = context.payload.workflow_run;

              // Get PRs associated with this workflow run
              const { data: pullRequests } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${workflowRun.head_branch}`,
                state: 'open'
              });

              if (pullRequests.length === 0) {
                console.log('No open pull requests found for workflow run branch:', workflowRun.head_branch);
                core.setOutput('issue_numbers', '');
                core.setOutput('pr_number', '');
                return [];
              }

              // Use the first matching PR
              pullRequest = pullRequests[0];
              prNumber = pullRequest.number;
              console.log(`Workflow run event for PR #${prNumber}`);

            } else if (context.payload.pull_request) {
              // For pull_request events, use the payload directly
              pullRequest = context.payload.pull_request;
              prNumber = pullRequest.number;
            } else {
              console.log('No pull request data available for event:', context.eventName);
              core.setOutput('issue_numbers', '');
              core.setOutput('pr_number', '');
              return [];
            }

            console.log(`Processing PR #${prNumber}: ${pullRequest.title}`);
            const issueNumbers = new Set();

            // Extract from PR body - excluding release notes sections
            const body = pullRequest.body || '';
            if (body) {
              // Remove release notes sections (case-insensitive)
              const cleanedBody = body.replace(/#{1,}\s*release\s*notes?\s*[\s\S]*?(?=#{1,}|$)/gi, '');

              // Extract issue numbers from cleaned body
              const bodyMatches = cleanedBody.matchAll(/#(\d+)/g);
              for (const match of bodyMatches) {
                issueNumbers.add(match[1]);
              }

              // Log if release notes were found and excluded
              if (body !== cleanedBody) {
                console.log('ℹ️ Excluded issue references from Release Notes section');
              }
            }

            // Extract from PR title
            const title = pullRequest.title || '';
            if (title) {
              const titleMatches = title.matchAll(/#(\d+)/g);
              for (const match of titleMatches) {
                issueNumbers.add(match[1]);
              }
            }

            // Convert Set to Array and output
            const uniqueIssues = Array.from(issueNumbers);
            core.setOutput('issue_numbers', uniqueIssues.join(','));
            core.setOutput('pr_number', prNumber.toString());

            if (uniqueIssues.length > 0) {
              console.log(`Found ${uniqueIssues.length} issue(s): #${uniqueIssues.join(', #')}`);
            } else {
              console.log('No issue references found in PR');
            }
            return uniqueIssues;

      - name: Check if feature env should be deployed
        id: check_feature_env
        if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request_target' && github.event.action == 'unlabeled' && github.event.label.name == 'skip-feature-env')
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const prNumber = "${{ steps.extract_issues.outputs.pr_number }}";
            if (!prNumber) return 'false';

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(prNumber)
            });

            const hasSkipLabel = pr.labels.some(label => label.name === 'skip-feature-env');
            if (hasSkipLabel) {
              console.log(`PR #${prNumber} has "skip-feature-env" label - skipping feature env deployment`);
              return 'false';
            }
            console.log(`PR #${prNumber} does not have "skip-feature-env" label - deploying feature env`);
            return 'true';

      - name: Update Feature env field when feature env is being deployed
        if: steps.check_feature_env.outputs.result == 'true' && steps.extract_issues.outputs.issue_numbers != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issueNumbers = "${{ steps.extract_issues.outputs.issue_numbers }}".split(',').filter(num => num);
            const prNumber = "${{ steps.extract_issues.outputs.pr_number }}";
            const featureEnvUrl = `https://dev-pr-${prNumber}.hub.staging.filigran.io/`;
            console.log(`Feature env deployment triggered for PR #${prNumber}`);
            console.log(`Setting Feature env URL: ${featureEnvUrl}`);

            if (issueNumbers.length === 0) {
              console.log('No linked issues to update');
              return;
            }
            // Process each linked issue
            for (const issueNumber of issueNumbers) {
              try {
                console.log(`Processing issue #${issueNumber}...`);
                // Get issue and its project items
                const issueData = await github.graphql(`
                  query($owner: String!, $repo: String!, $issueNumber: Int!) {
                    repository(owner: $owner, name: $repo) {
                      issue(number: $issueNumber) {
                        id
                        projectItems(first: 10) {
                          nodes {
                            id
                            project {
                              id
                              number
                              fields(first: 40) {
                                nodes {
                                  __typename
                                  ... on ProjectV2Field {
                                    id
                                    name
                                    dataType
                                  }
                                  ... on ProjectV2SingleSelectField {
                                    id
                                    name
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issueNumber: parseInt(issueNumber)
                });
                if (!issueData.repository.issue) {
                  console.log(`Issue #${issueNumber} not found`);
                  continue;
                }
                // Find the project item that matches our project number
                const projectItem = issueData.repository.issue.projectItems.nodes.find(
                  item => item.project.number === parseInt(process.env.PROJECT_NUMBER)
                );
                if (!projectItem) {
                  console.log(`Issue #${issueNumber} is not in project #${process.env.PROJECT_NUMBER}, skipping...`);
                  continue;
                }
                console.log(`Issue #${issueNumber} found in project #${process.env.PROJECT_NUMBER}`);
                // Find the Feature env field
                const featureEnvField = projectItem.project.fields.nodes.find(f =>
                  f.name === 'Feature env' && f.dataType
                );
                if (!featureEnvField) {
                  console.log('Feature env field not found in project');
                  console.log('Available fields:', projectItem.project.fields.nodes.map(f => `${f.name} (${f.dataType || 'select'})`));
                  continue;
                }
                console.log(`Found Feature env field with ID: ${featureEnvField.id}`);
                // Update the Feature env field with PR number URL
                console.log(`Updating Feature env for issue #${issueNumber} with PR #${prNumber} URL...`);
                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: {
                          text: $value
                        }
                      }
                    ) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `, {
                  projectId: projectItem.project.id,
                  itemId: projectItem.id,
                  fieldId: featureEnvField.id,
                  value: featureEnvUrl
                });
                console.log(`✅ Successfully set Feature env for issue #${issueNumber} to: ${featureEnvUrl}`);
              } catch (error) {
                console.error(`Error updating issue #${issueNumber}:`, error);
                if (error.errors) {
                  error.errors.forEach(e => console.error('GraphQL error:', e.message));
                }
              }
            }

      - name: Update issues status and start date in project
        if: steps.extract_issues.outputs.issue_numbers != '' && github.event.action != 'closed'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issueNumbers = "${{ steps.extract_issues.outputs.issue_numbers }}".split(',').filter(num => num);
            const pr = context.payload.pull_request;
            let status = '';

            // List of statuses we should NOT modify (immutable statuses)
            const immutableStatuses = [
              'done',
              'cancelled',
              'archived'
            ];

            // Determine the status based on PR state
            if (context.eventName === 'pull_request') {
              if (pr.draft) {
                status = 'Development';
              } else if (pr.state === 'open') {
                status = 'Code review';
              }
            }

            if (status && issueNumbers.length > 0) {
              // First, get the project details to find the status field and options
              const projectQuery = `
                query($org: String!, $projectNumber: Int!) {
                  organization(login: $org) {
                    projectV2(number: $projectNumber) {
                      id
                      title
                      fields(first: 40) {
                        nodes {
                          __typename
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                          ... on ProjectV2Field {
                            id
                            name
                            dataType
                          }
                        }
                      }
                    }
                  }
                }
              `;
              console.log('Fetching project from organization...');
              const projectData = await github.graphql(projectQuery, {
                org: process.env.ORGANIZATION,
                projectNumber: parseInt(process.env.PROJECT_NUMBER)
              });
              const project = projectData.organization.projectV2;
              console.log(`Found project: ${project.title}`);

              // Find the Status field
              const statusField = project.fields.nodes.find(field =>
                field.name === 'Status' && field.options
              );

              // Find the Start date field using lowercase comparison
              const startDateField = project.fields.nodes.find(field =>
                field.name.toLowerCase() === 'start date' && field.dataType === 'DATE'
              );

              if (!statusField) {
                console.log('Status field not found');
                console.log('Available fields:', project.fields.nodes.map(f => f.name));
                return;
              }

              if (!startDateField) {
                console.log('Start date field not found');
                console.log('Available date fields:', project.fields.nodes.filter(f => f.dataType === 'DATE').map(f => `${f.name} (${f.dataType})`));
              }

              // Find the matching status option
              const statusOption = statusField.options.find(option =>
                option.name.toLowerCase() === status.toLowerCase()
              );

              if (!statusOption) {
                console.log(`Status option "${status}" not found`);
                console.log('Available options:', statusField.options.map(o => o.name));
                return;
              }

              // Process each issue
              for (const issueNumber of issueNumbers) {
                try {
                  console.log(`Processing issue #${issueNumber}...`);

                  // Query for the issue and its project items with field values
                  const issueQuery = `
                    query($owner: String!, $repo: String!, $issueNumber: Int!) {
                      repository(owner: $owner, name: $repo) {
                        issue(number: $issueNumber) {
                          id
                          projectItems(first: 10) {
                            nodes {
                              id
                              project {
                                id
                                number
                              }
                              fieldValues(first: 40) {
                                nodes {
                                  __typename
                                  ... on ProjectV2ItemFieldSingleSelectValue {
                                    field {
                                      ... on ProjectV2SingleSelectField {
                                        id
                                        name
                                      }
                                    }
                                    name
                                  }
                                  ... on ProjectV2ItemFieldDateValue {
                                    field {
                                      ... on ProjectV2Field {
                                        id
                                        name
                                      }
                                    }
                                    date
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  `;

                  const issueData = await github.graphql(issueQuery, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issueNumber: parseInt(issueNumber)
                  });

                  if (!issueData.repository.issue) {
                    console.log(`Issue #${issueNumber} not found`);
                    continue;
                  }

                  // Find the project item for our specific project
                  const projectItem = issueData.repository.issue.projectItems.nodes.find(item =>
                    item.project.number === parseInt(process.env.PROJECT_NUMBER)
                  );

                  if (!projectItem) {
                    console.log(`Issue #${issueNumber} is not in project #${process.env.PROJECT_NUMBER}, skipping...`);
                    continue;
                  }

                  // Find current status from field values
                  const currentStatusField = projectItem.fieldValues.nodes.find(fv =>
                    fv.__typename === 'ProjectV2ItemFieldSingleSelectValue' &&
                    fv.field?.name === 'Status'
                  );
                  const currentStatus = currentStatusField?.name?.toLowerCase() || '';
                  console.log(`Issue #${issueNumber} current status: "${currentStatus}"`);

                  // Check if the current status is immutable (should not be modified)
                  if (immutableStatuses.some(immutableStatus =>
                    currentStatus.toLowerCase() === immutableStatus.toLowerCase()
                  )) {
                    console.log(`⚠️ Issue #${issueNumber} is in "${currentStatus}" status and should not be modified. Skipping...`);
                    continue;
                  }

                  // Update the status field
                  console.log(`Updating status for issue #${issueNumber} from "${currentStatus}" to "${status}"...`);
                  const updateMutation = `
                    mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                      updateProjectV2ItemFieldValue(
                        input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          value: {
                            singleSelectOptionId: $optionId
                          }
                        }
                      ) {
                        projectV2Item {
                          id
                        }
                      }
                    }
                  `;

                  await github.graphql(updateMutation, {
                    projectId: project.id,
                    itemId: projectItem.id,
                    fieldId: statusField.id,
                    optionId: statusOption.id
                  });
                  console.log(`✅ Successfully updated issue #${issueNumber} status to "${status}"`);

                  // Update Start date if not already set and status is "dev in progress"
                  if (status.toLowerCase() === 'dev in progress' && startDateField) {
                    // Find current start date from field values using lowercase comparison
                    const currentStartDateField = projectItem.fieldValues.nodes.find(fv =>
                      fv.__typename === 'ProjectV2ItemFieldDateValue' &&
                      fv.field?.name?.toLowerCase() === 'start date'
                    );
                    const currentStartDate = currentStartDateField?.date;

                    if (!currentStartDate) {
                      const today = new Date().toISOString().split('T')[0]; // Format: YYYY-MM-DD
                      console.log(`Setting Start date for issue #${issueNumber} to ${today}...`);

                      await github.graphql(`
                        mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $date: Date!) {
                          updateProjectV2ItemFieldValue(
                            input: {
                              projectId: $projectId
                              itemId: $itemId
                              fieldId: $fieldId
                              value: {
                                date: $date
                              }
                            }
                          ) {
                            projectV2Item {
                              id
                            }
                          }
                        }
                      `, {
                        projectId: project.id,
                        itemId: projectItem.id,
                        fieldId: startDateField.id,
                        date: today
                      });
                      console.log(`✅ Successfully set Start date for issue #${issueNumber}`);
                    } else {
                      console.log(`Start date already set for issue #${issueNumber}: ${currentStartDate}`);
                    }
                  }

                } catch (error) {
                  console.error(`Error updating issue #${issueNumber}:`, error);
                  if (error.errors) {
                    error.errors.forEach(e => console.error('GraphQL error:', e.message));
                  }
                }
              }
            }

      - name: Update issues status to Ready to be deployed and set Effective end date on merge
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && steps.extract_issues.outputs.issue_numbers != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issueNumbers = "${{ steps.extract_issues.outputs.issue_numbers }}".split(',').filter(num => num);

            if (issueNumbers.length === 0) {
              console.log('No issues to update');
              return;
            }

            // List of statuses we should NOT modify (immutable statuses)
            const immutableStatuses = [
              'done',
              'cancelled',
              'archived'
            ];

            const newStatus = 'Ready to Deploy';
            console.log(`PR merged! Updating ${issueNumbers.length} issue(s) to status: "${newStatus}" and setting Effective end date`);

            try {
              // Get project once
              const projectData = await github.graphql(`
                query($org: String!, $projectNumber: Int!) {
                  organization(login: $org) {
                    projectV2(number: $projectNumber) {
                      id
                      fields(first: 40) {
                        nodes {
                          __typename
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                          ... on ProjectV2Field {
                            id
                            name
                            dataType
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                org: process.env.ORGANIZATION,
                projectNumber: parseInt(process.env.PROJECT_NUMBER)
              });

              const project = projectData.organization.projectV2;
              const statusField = project.fields.nodes.find(f => f.name === 'Status' && f.options);

              // Find the Effective end date field using lowercase comparison
              const effectiveEndDateField = project.fields.nodes.find(field =>
                field.name.toLowerCase() === 'effective end date' && field.dataType === 'DATE'
              );

              if (!statusField) {
                console.log('Status field not found');
                return;
              }

              if (!effectiveEndDateField) {
                console.log('Effective end date field not found');
                console.log('Available date fields:', project.fields.nodes.filter(f => f.dataType === 'DATE').map(f => `${f.name} (${f.dataType})`));
              }

              const statusOption = statusField.options.find(o =>
                o.name.toLowerCase() === newStatus.toLowerCase()
              );

              if (!statusOption) {
                console.log(`Status option "${newStatus}" not found`);
                console.log('Available options:', statusField.options.map(o => o.name));
                return;
              }

              // Process each issue
              for (const issueNumber of issueNumbers) {
                try {
                  console.log(`Processing issue #${issueNumber} for merge status...`);

                  // Query for the issue and its project items
                  const issueQuery = `
                    query($owner: String!, $repo: String!, $issueNumber: Int!) {
                      repository(owner: $owner, name: $repo) {
                        issue(number: $issueNumber) {
                          id
                          projectItems(first: 10) {
                            nodes {
                              id
                              project {
                                id
                                number
                              }
                              fieldValues(first: 40) {
                                nodes {
                                  __typename
                                  ... on ProjectV2ItemFieldSingleSelectValue {
                                    field {
                                      ... on ProjectV2SingleSelectField {
                                        id
                                        name
                                      }
                                    }
                                    name
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  `;

                  const issueData = await github.graphql(issueQuery, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issueNumber: parseInt(issueNumber)
                  });

                  if (!issueData.repository.issue) {
                    console.log(`Issue #${issueNumber} not found`);
                    continue;
                  }

                  // Find the project item for our specific project
                  const projectItem = issueData.repository.issue.projectItems.nodes.find(item =>
                    item.project.number === parseInt(process.env.PROJECT_NUMBER)
                  );

                  if (!projectItem) {
                    console.log(`Issue #${issueNumber} is not in project #${process.env.PROJECT_NUMBER}, skipping...`);
                    continue;
                  }

                  // Find current status from field values
                  const currentStatusField = projectItem.fieldValues.nodes.find(fv =>
                    fv.__typename === 'ProjectV2ItemFieldSingleSelectValue' &&
                    fv.field?.name === 'Status'
                  );
                  const currentStatus = currentStatusField?.name?.toLowerCase() || '';
                  console.log(`Issue #${issueNumber} current status: "${currentStatus}"`);

                  // Check if the current status is immutable (should not be modified)
                  if (immutableStatuses.some(immutableStatus =>
                    currentStatus.toLowerCase() === immutableStatus.toLowerCase()
                  )) {
                    console.log(`⚠️ Issue #${issueNumber} is in "${currentStatus}" status and should not be modified. Skipping...`);
                    continue;
                  }

                  await github.graphql(`
                    mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                      updateProjectV2ItemFieldValue(
                        input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          value: { singleSelectOptionId: $optionId }
                        }
                      ) {
                        projectV2Item { id }
                      }
                    }
                  `, {
                    projectId: project.id,
                    itemId: projectItem.id,
                    fieldId: statusField.id,
                    optionId: statusOption.id
                  });

                  console.log(`✅ Updated issue #${issueNumber} status to "${newStatus}"`);

                  // Set Effective end date
                  if (effectiveEndDateField) {
                    const today = new Date().toISOString().split('T')[0]; // Format: YYYY-MM-DD
                    console.log(`Setting Effective end date for issue #${issueNumber} to ${today}...`);

                    await github.graphql(`
                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $date: Date!) {
                        updateProjectV2ItemFieldValue(
                          input: {
                            projectId: $projectId
                            itemId: $itemId
                            fieldId: $fieldId
                            value: {
                              date: $date
                            }
                          }
                        ) {
                          projectV2Item {
                            id
                          }
                        }
                      }
                    `, {
                      projectId: project.id,
                      itemId: projectItem.id,
                      fieldId: effectiveEndDateField.id,
                      date: today
                    });
                    console.log(`✅ Successfully set Effective end date for issue #${issueNumber}`);
                  }

                } catch (error) {
                  console.error(`Error updating issue #${issueNumber}:`, error);
                }
              }
            } catch (error) {
              console.error('Error updating project status:', error);
            }

      - name: Check for approval and label
        if: github.event_name == 'pull_request_review' || github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const issueNumbers = "${{ steps.extract_issues.outputs.issue_numbers }}".split(',').filter(num => num);
            const prNumber = "${{ steps.extract_issues.outputs.pr_number }}";

            if (issueNumbers.length === 0 || !prNumber) return;

            // Only proceed if workflow_run was successful
            if (context.eventName === 'workflow_run' && context.payload.workflow_run.conclusion !== 'success') {
              console.log(`Workflow run conclusion: ${context.payload.workflow_run.conclusion}. Skipping status update.`);
              return;
            }

            // List of statuses we should NOT modify (immutable statuses)
            const immutableStatuses = [
              'done',
              'cancelled',
              'archived',
              'ready to merge'
            ];

            // Get PR data using the PR number from extract_issues step
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(prNumber)
            });

            // Get reviews
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(prNumber)
            });

            // Check if PR has approval
            const hasApproval = reviews.some(review => review.state === 'APPROVED');

            // Get check runs for the PR
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha
            });

            // Filter out this workflow and the advisory platform e2e tests (rolling OpenCTI / OpenAEV images),
            // and check if all other checks have completed
            const relevantChecks = checkRuns.check_runs.filter(check =>
              !check.name.includes('PR and Issue Status Management') &&
              !check.name.includes('manage-pr-and-issues') &&
              !check.name.startsWith('run-e2e-platform-tests')
            );

            const allChecksCompleted = relevantChecks.length > 0 &&
              relevantChecks.every(check => check.status === 'completed');

            const allChecksPassed = relevantChecks.length > 0 &&
              relevantChecks.every(check =>
                check.status === 'completed' &&
                (check.conclusion === 'success' || check.conclusion === 'skipped')
              );

            // Log check status for debugging
            console.log(`Checks status - Completed: ${allChecksCompleted}, Passed: ${allChecksPassed}`);
            console.log(`Has approval: ${hasApproval}`);

            if (relevantChecks.length > 0) {
              console.log('Check runs status:');
              relevantChecks.forEach(check => {
                console.log(`  - ${check.name}: ${check.status} (${check.conclusion || 'in progress'})`);
              });
            }

            // Require BOTH approval AND passing checks
            if (!hasApproval || !allChecksPassed) {
              if (!hasApproval && !allChecksPassed) {
                console.log('Waiting for both PR approval and checks to pass. Skipping status update.');
              } else if (!hasApproval) {
                console.log('Checks passed but waiting for PR approval. Skipping status update.');
              } else if (!allChecksPassed) {
                console.log('PR approved but waiting for checks to pass. Skipping status update.');
              }
              return;
            }

            console.log('✅ Both approval and checks have passed!');

            // Check for skip-feature-env label (opt-out: feature env is deployed by default)
            const hasSkipFeatureEnvLabel = pr.labels.some(label => label.name === 'skip-feature-env');

            let newStatus = '';

            if (hasSkipFeatureEnvLabel) {
              newStatus = 'Ready to Merge';
            } else {
              // Feature env deployment is required - wait for testing before merging
              return;
            }

            console.log(`Setting status to: ${newStatus}`);

            try {
              // Get project once
              const projectData = await github.graphql(`
                query($org: String!, $projectNumber: Int!) {
                  organization(login: $org) {
                    projectV2(number: $projectNumber) {
                      id
                      fields(first: 40) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options {
                              id
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                org: process.env.ORGANIZATION,
                projectNumber: parseInt(process.env.PROJECT_NUMBER)
              });

              const project = projectData.organization.projectV2;
              const statusField = project.fields.nodes.find(f => f.name === 'Status' && f.options);

              if (statusField) {
                const statusOption = statusField.options.find(o =>
                  o.name.toLowerCase() === newStatus.toLowerCase()
                );

                if (statusOption) {
                  // Process each issue
                  for (const issueNumber of issueNumbers) {
                    try {
                      console.log(`Processing issue #${issueNumber} for approval status...`);

                      // Query for the issue and its project items with field values
                      const issueQuery = `
                        query($owner: String!, $repo: String!, $issueNumber: Int!) {
                          repository(owner: $owner, name: $repo) {
                            issue(number: $issueNumber) {
                              id
                              projectItems(first: 10) {
                                nodes {
                                  id
                                  project {
                                    id
                                    number
                                  }
                                  fieldValues(first: 40) {
                                    nodes {
                                      __typename
                                      ... on ProjectV2ItemFieldSingleSelectValue {
                                        field {
                                          ... on ProjectV2SingleSelectField {
                                            id
                                            name
                                          }
                                        }
                                        name
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      `;

                      const issueData = await github.graphql(issueQuery, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issueNumber: parseInt(issueNumber)
                      });

                      if (!issueData.repository.issue) {
                        console.log(`Issue #${issueNumber} not found`);
                        continue;
                      }

                      // Find the project item for our specific project
                      const projectItem = issueData.repository.issue.projectItems.nodes.find(item =>
                        item.project.number === parseInt(process.env.PROJECT_NUMBER)
                      );

                      if (!projectItem) {
                        console.log(`Issue #${issueNumber} is not in project #${process.env.PROJECT_NUMBER}, skipping...`);
                        continue;
                      }

                      // Find current status from field values
                      const currentStatusField = projectItem.fieldValues.nodes.find(fv =>
                        fv.__typename === 'ProjectV2ItemFieldSingleSelectValue' &&
                        fv.field?.name === 'Status'
                      );
                      const currentStatus = currentStatusField?.name?.toLowerCase() || '';
                      console.log(`Issue #${issueNumber} current status: "${currentStatus}"`);

                      // Check if the current status is immutable (should not be modified)
                      if (immutableStatuses.some(immutableStatus =>
                        currentStatus.toLowerCase() === immutableStatus.toLowerCase()
                      )) {
                        console.log(`⚠️ Issue #${issueNumber} has status "${currentStatus}" which should not be modified. Skipping...`);
                        continue;
                      }

                      await github.graphql(`
                        mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                          updateProjectV2ItemFieldValue(
                            input: {
                              projectId: $projectId
                              itemId: $itemId
                              fieldId: $fieldId
                              value: { singleSelectOptionId: $optionId }
                            }
                          ) {
                            projectV2Item { id }
                          }
                        }
                      `, {
                        projectId: project.id,
                        itemId: projectItem.id,
                        fieldId: statusField.id,
                        optionId: statusOption.id
                      });

                      console.log(`✅ Updated issue #${issueNumber} status from "${currentStatus}" to "${newStatus}"`);
                    } catch (error) {
                      console.error(`Error updating issue #${issueNumber}:`, error);
                    }
                  }
                }
              }
            } catch (error) {
              console.error('Error updating project status:', error);
            }

  deploy-feature-env:
    needs: manage-pr-and-issues
    if: github.event_name == 'pull_request_target' && github.event.action == 'unlabeled' && github.event.label.name == 'skip-feature-env' && needs.manage-pr-and-issues.outputs.pr_number != ''
    uses: ./.github/workflows/test-feature-branch.yml
    with:
      pr_number: ${{ needs.manage-pr-and-issues.outputs.pr_number }}
    secrets: inherit
