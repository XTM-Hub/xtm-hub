---
name: Deploy an ephemeral environment to test a specific pull request

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request Number"
        type: string
        required: true
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request Number"
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  deploy-feature-branch:
    runs-on: ubuntu-26.04
    steps:
      # Sparse checkout keeps the root files, so .nvmrc is there too.
      - name: Checkout AWX action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/awx-launch
      - name: Setup Node Js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Define NODE_ENV based on branch name
        run: |
          if [[ ${{ github.ref }} =~ refs/hotfix/.* ]]; then
              echo "NODE_ENV=production" >> "$GITHUB_ENV"
          else
              echo "NODE_ENV=development" >> "$GITHUB_ENV"
          fi
      - name: Deploy feature environment
        uses: ./.github/actions/awx-launch
        with:
          template: Deploy XTM Hub feature branch for testing
          inventory: eu-west-staging
          extra-vars: '{"env":"Development","xtmhub_version":"${{ inputs.pr_number }}","xtmhub_node_env":"${{ env.NODE_ENV }}"}'
          token: ${{ secrets.AWX_TOKEN }}
