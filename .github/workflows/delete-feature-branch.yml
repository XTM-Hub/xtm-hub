---

name: Delete an ephemeral environment

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  deploy-feature-branch:
    runs-on: ubuntu-26.04
    steps:
      # awxkit overrides argparse's private `_parse_known_args` with the pre-3.12.7 signature, so it crashes
      # on newer Pythons (the ubuntu-26.04 system Python is 3.14). Keep Python on 3.11 until awxkit is fixed.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"
      - name: Install AWX cli
        run: pip install awxkit
      - name: Deploy feature environment
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Delete XTM Hub feature branch for testing' \
            --inventory eu-west-staging \
            --extra_vars "{\"env\":\"Development\",\"xtmhub_version\":\"${{ inputs.pr_number }}\"}"
