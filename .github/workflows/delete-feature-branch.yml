---

name: Delete an ephemeral environment

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  deploy-feature-branch:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout AWX action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/awx-launch
      - name: Deploy feature environment
        uses: ./.github/actions/awx-launch
        with:
          template: Delete XTM Hub feature branch for testing
          inventory: eu-west-staging
          extra-vars: '{"env":"Development","xtmhub_version":"${{ inputs.pr_number }}"}'
          token: ${{ secrets.AWX_TOKEN }}
