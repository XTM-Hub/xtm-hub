name: Auto delete feature env
on:
  pull_request:
    types:
      - closed

permissions: {}

jobs:
  delete-feature-env:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # awxkit overrides argparse's private `_parse_known_args` with the pre-3.12.7 signature, so it crashes
      # on newer Pythons (the ubuntu-26.04 system Python is 3.14). Keep Python on 3.11 until awxkit is fixed.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"
      - name: Install AWX cli
        run: pip install awxkit

      - name: Delete
        run: |
          awx --conf.host https://awx.filigran.io \
            --conf.token ${{ secrets.AWX_TOKEN }} \
            -f human job_templates launch 'Delete XTM Hub feature branch for testing' \
            --inventory eu-west-staging \
            --extra_vars "{\"env\":\"Development\",\"xtmhub_version\":\"pr-${{ github.event.pull_request.number }}\"}"
