# Design system migration status, BMAD sprint-status style.
# Read and written by ds-migration/run.sh. The order of development_status is the build order.
#
# Item status:
#   backlog      not started (the workflow writes its spec and updates its issue)
#   in-progress  a Claude Code session is working on it
#   review       committed and pushed, the PR's required checks are running
#   done         required checks passed
#   blocked      needs a human: the question is on the issue, labelled "needs more info"
#
# Epic status:
#   backlog      not started
#   in-progress  items are being migrated
#   review       every item is done or blocked: run.sh posted the epic report and stopped
#   done         set by a human after reviewing the PR; only then does the next epic start
#
# Only legacy components the app still imports are here. Adopting the design system components
# the app does not use yet is phase 2, epic #3709.
#
# Item keys are <issue>-<slug>. A new-<slug> key has no issue yet:
# `ds-migration/run.sh issues` creates it as a sub-issue of the epic and renames the key.

