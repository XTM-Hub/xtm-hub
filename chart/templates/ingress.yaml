apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Namespace}}-{{ .Release.Name }}-ingress
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls_issuer }}
    external-dns.alpha.kubernetes.io/hostname: {{ tpl .Values.xtmhub.host . }}
    external-dns.alpha.kubernetes.io/ttl: "120"
    prometheus.io/probe: "true"
    {{- if eq .Values.ingressClass "nginx" }}
    {{- if .Values.xtmhub.wwwRedirect }}
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: 256m
    nginx.ingress.kubernetes.io/retry-non-idempotent: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30s"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503 http_504"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png|svg|ico)) {
        expires 1M;
        add_header Cache-Control "public";
      }
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingressClass }} 
  rules:
  - host: {{ .Values.xtmhub.host }}
    http:
      paths:
      - backend:
          service:
            name: xtmhub-front
            port:
              number: 3000
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - {{ .Values.xtmhub.host }}
    {{- if .Values.xtmhub.wwwRedirect }}
    # The certificate must also cover the www host for the HTTPS redirect to work
    - www.{{ .Values.xtmhub.host }}
    {{- end }}
    secretName: xtmhub-cert
