apiVersion: v1
kind: Secret
metadata:
  name: xtmhub-api-config
type: Opaque
data:
  ADMIN_EMAIL: {{.Values.xtmhub.api.admin.email | b64enc }}
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace "xtmhub-api-config") | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- $adminpass := (get $secretData "ADMIN_PASSWORD") | default (randAlphaNum 16 | b64enc) }}
  ADMIN_PASSWORD: {{ $adminpass }}
  OIDC_CLIENT_SECRET: {{.Values.xtmhub.api.secret.OIDC_CLIENT_SECRET | b64enc }}
  {{- /* Threat Pulse keys: 64 hexadecimal characters, never rotated (rotating them unlinks the stored statistics). A
  key set in the values wins, then the one of the existing Secret, then one generated once. With existingSecret, the
  keys come from that Secret and are not written here. */}}
  {{- /* Values of a release installed before these keys existed (helm upgrade --reuse-values) have no pulse map. */}}
  {{- $pulse := .Values.xtmhub.api.pulse | default dict }}
  {{- $atRestKey := $pulse.atRestKey | default "" }}
  {{- $platformKey := $pulse.platformKey | default "" }}
  {{- if not $pulse.existingSecret }}
  {{- range $name, $value := dict "atRestKey" $atRestKey "platformKey" $platformKey }}
  {{- if and $value (not (regexMatch "^[0-9a-fA-F]{64}$" $value)) }}
  {{- fail (printf "xtmhub.api.pulse.%s must be 64 hexadecimal characters" $name) }}
  {{- end }}
  {{- end }}
  {{- $storedAtRestKey := (get $secretData "PULSE_AT_REST_KEY") | default "" }}
  {{- $storedPlatformKey := (get $secretData "PULSE_PLATFORM_KEY") | default "" }}
  {{- /* One key in the values and the other in neither the values nor the chart's Secret (first install, or a render
  without access to the cluster): the other would be generated again at every render. */}}
  {{- if or (and $atRestKey (not $platformKey) (not $storedPlatformKey)) (and $platformKey (not $atRestKey) (not $storedAtRestKey)) }}
  {{- fail "xtmhub.api.pulse.atRestKey and xtmhub.api.pulse.platformKey: set both, or one of them only when the chart's Secret already holds the other" }}
  {{- end }}
  {{- $pulseAtRestKey := ternary ($atRestKey | b64enc) ($storedAtRestKey | default (randAlphaNum 64 | sha256sum | b64enc)) (not (empty $atRestKey)) }}
  {{- $pulsePlatformKey := ternary ($platformKey | b64enc) ($storedPlatformKey | default (randAlphaNum 64 | sha256sum | b64enc)) (not (empty $platformKey)) }}
  PULSE_AT_REST_KEY: {{ $pulseAtRestKey }}
  PULSE_PLATFORM_KEY: {{ $pulsePlatformKey }}
  {{- end }}
