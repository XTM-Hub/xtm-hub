{{- if and (.Values.kibana.enabled) (.Values.kibana.ingress.enabled) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Namespace}}-{{ .Release.Name }}-ingress-kibana
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls_issuer }}
    external-dns.alpha.kubernetes.io/hostname: kibana.{{ .Values.xtmhub.host }}
    prometheus.io/probe: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 512m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-stream-timeout: "1800"
    nginx.ingress.kubernetes.io/send_timeout: "1800"
    {{- if and (eq .Values.ingressClass "nginx") (not (hasKey .Values.kibana.ingress.annotations "nginx.ingress.kubernetes.io/whitelist-source-range")) }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.kibana.ingress.whitelistSourceRange }}
    {{- end }}
    {{- with .Values.kibana.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingressClass }} 
  rules:
  - host: kibana.{{ .Values.xtmhub.host }}
    http:
      paths:
        - backend:
            service:
              name: kibana-kb-http
              port:
                number: 5601
          path: /
          pathType: Prefix
  tls:
  - hosts:
    - kibana.{{ .Values.xtmhub.host }}
    secretName: xtmhub-cert-kibana
{{- end }}
