<!doctype html>
<html
  lang="en"
  xmlns:v="urn:schemas-microsoft-com:vml">
  <head>
    <meta charset="utf-8" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no, url=no" />
    <meta
      name="color-scheme"
      content="light" />
    <meta
      name="supported-color-schemes"
      content="light" />
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings
            xmlns:o="urn:schemas-microsoft-com:office:office">
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
      <style>
        td,
        th,
        div,
        p,
        a,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
          font-family: 'Segoe UI', sans-serif;
          mso-line-height-rule: exactly;
        }
      </style>
    <![endif]-->
    <title>{{ title }}</title>
    <!--
      Layout tables (role="presentation"), inline styles and PNG images only:
      Gmail drops CSS attribute selectors (a `display: table` div layout falls
      apart into stacked blocks) and never renders SVG. The class rules below
      only adjust paddings on small screens; a client ignoring them keeps the
      desktop layout.
    -->
    <style>
      @media (max-width: 600px) {
        .sm-my-8 {
          padding-top: 32px !important;
          padding-bottom: 32px !important;
        }
        .sm-px-4 {
          padding-left: 16px !important;
          padding-right: 16px !important;
        }
        .sm-px-6 {
          padding-left: 24px !important;
          padding-right: 24px !important;
        }
        .sm-leading-8 {
          line-height: 32px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      width: 100%;
      background-color: #f1f5f9;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      word-break: break-word;
    ">
    <div
      role="article"
      aria-roledescription="email"
      aria-label="{{ title }}"
      lang="en">
      <table
        role="presentation"
        width="100%"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="
          background-color: #f1f5f9;
          font-family:
            ui-sans-serif,
            system-ui,
            -apple-system,
            'Segoe UI',
            sans-serif;
        ">
        <tr>
          <td
            align="center"
            class="sm-px-4">
            <table
              role="presentation"
              width="552"
              cellpadding="0"
              cellspacing="0"
              border="0"
              style="width: 552px; max-width: 100%">
              <tr>
                <td
                  align="center"
                  class="sm-my-8"
                  style="padding-top: 40px; padding-bottom: 40px">
                  <a href="{{ base_url_front }}">
                    <img
                      src="{{ base_url_front }}/logo_xtm_hub_email.png"
                      width="320"
                      height="96"
                      alt="XTM Hub"
                      style="
                        display: block;
                        width: 320px;
                        max-width: 100%;
                        height: auto;
                        border: 0;
                      " />
                  </a>
                </td>
              </tr>
              <tr>
                <td
                  class="sm-px-6"
                  style="
                    border-radius: 4px;
                    background-color: #fffffe;
                    padding: 48px;
                    font-size: 16px;
                    color: #00020c;
                    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
                  ">
                  {{> @partial-block}}
                </td>
              </tr>
              <tr>
                <td style="height: 16px; line-height: 16px; font-size: 0">
                  &zwj;
                </td>
              </tr>
              <tr>
                <td
                  align="center"
                  style="
                    padding-left: 24px;
                    padding-right: 24px;
                    text-align: center;
                    font-size: 12px;
                    color: #00020c;
                  ">
                  <table
                    role="presentation"
                    align="center"
                    cellpadding="0"
                    cellspacing="0"
                    border="0"
                    style="margin: 16px auto">
                    <tr>
                      <td style="padding: 4px">
                        <a href="https://filigran.io/">
                          <img
                            src="{{ base_url_front }}/website.png"
                            width="24"
                            height="24"
                            alt="Filigran website"
                            style="display: block; border: 0" />
                        </a>
                      </td>
                      <td style="padding: 4px">
                        <a
                          href="https://filigran-community.slack.com/join/shared_invite/zt-2pp43qkqc-EY7qC7Sk30zZfsNjgXwF5w">
                          <img
                            src="{{ base_url_front }}/slack.png"
                            width="24"
                            height="24"
                            alt="Slack community"
                            style="display: block; border: 0" />
                        </a>
                      </td>
                      <td style="padding: 4px">
                        <a href="https://www.linkedin.com/company/filigran">
                          <img
                            src="{{ base_url_front }}/linkedin.png"
                            width="24"
                            height="24"
                            alt="Linkedin page"
                            style="display: block; border: 0" />
                        </a>
                      </td>
                      <td style="padding: 4px">
                        <a href="https://www.youtube.com/@Filigran">
                          <img
                            src="{{ base_url_front }}/youtube.png"
                            width="24"
                            height="24"
                            alt="Youtube channel"
                            style="display: block; border: 0" />
                        </a>
                      </td>
                      <td style="padding: 4px">
                        <a href="https://x.com/FiligranHQ">
                          <img
                            src="{{ base_url_front }}/twitter.png"
                            width="24"
                            height="24"
                            alt="X link"
                            style="display: block; border: 0" />
                        </a>
                      </td>
                    </tr>
                  </table>
                  <a href="https://filigran.io">
                    <img
                      src="{{ base_url_front }}/logo-filigran.png"
                      width="100"
                      height="25"
                      alt="Filigran logo"
                      style="display: inline-block; border: 0" />
                  </a>
                  <p style="margin: 8px 0 40px">
                    New York, Paris, London, Sydney, Singapore, Tokyo
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
