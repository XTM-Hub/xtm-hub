enum FeatureFlag {
  DUMMY
  DECOUPLING_CONNECTORS
}

type PlatformProvider {
  name: String!
  type: String!
  provider: String!
}

"What this Hub accepts, for API clients that detect a feature before using it"
enum SettingsCapability {
  API_TOKENS
}

type Settings {
  capabilities: [SettingsCapability!]!
  platform_feature_flags: [FeatureFlag!]!
  platform_providers: [PlatformProvider!]!
  base_url_front: String!
  environment: String!
}

type Query {
  settings: Settings!
}
