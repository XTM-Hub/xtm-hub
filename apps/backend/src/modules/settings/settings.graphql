enum FeatureFlag {
  DUMMY
  DECOUPLING_CONNECTORS
  TRIAL_INVITE
}

type PlatformProvider {
  name: String!
  type: String!
  provider: String!
}

type Settings {
  platform_feature_flags: [FeatureFlag!]!
  platform_providers: [PlatformProvider!]!
  base_url_front: String!
  environment: String!
}

type Query {
  settings: Settings!
}
