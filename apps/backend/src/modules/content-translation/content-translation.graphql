enum Locale {
  en
  fr
  ja
}

type ContentTranslationEntry {
  key: String!
  locale: Locale!
  value: String!
  updated_at: Date!
  # Editors only: contentTranslations is public.
  updater_id: UserId @auth(portalCapa: [BYPASS])
}

input ContentTranslationValueInput {
  locale: Locale!
  value: String!
}

input UpsertContentTranslationInput {
  key: String!
  values: [ContentTranslationValueInput!]!
}

type Query {
  # Fetches translations to overlay on top of the static next-intl JSON
  # messages. Omitting keys returns every entry for the given locale (used to
  # hydrate a whole page); omitting locale returns every locale for the given
  # keys (used by the edit dialog to show all language tabs at once).
  contentTranslations(
    locale: Locale
    keys: [String!]
  ): [ContentTranslationEntry!]!
  # Pending edits, shared by every editor and invisible to visitors until
  # published. Omitting keys returns every draft.
  contentTranslationDrafts(keys: [String!]): [ContentTranslationEntry!]!
    @auth(portalCapa: [BYPASS])
}

type Mutation {
  # Saves one or more locale values for a single content key as drafts (one
  # row per locale), returning the saved rows.
  saveContentTranslationDraft(
    input: UpsertContentTranslationInput!
  ): [ContentTranslationEntry!]! @auth(portalCapa: [BYPASS])
  # Makes every draft live at once, returning the published rows.
  publishContentTranslationDrafts: [ContentTranslationEntry!]!
    @auth(portalCapa: [BYPASS])
  # Deletes every draft, returning how many rows were discarded.
  discardContentTranslationDrafts: Int! @auth(portalCapa: [BYPASS])
}
