type RegisteredProductVersion {
  product: PlatformIdentifier!
  version: String!
  created_at: Date!
}

type Query {
  """
  Returns at most the 5 latest registered versions for the given product,
  most recent first. When `search` is provided, only versions whose string
  contains it (case-insensitive) are considered.
  """
  registeredProductVersions(
    product: PlatformIdentifier!
    search: String
  ): [RegisteredProductVersion!]!
}

type Mutation {
  newProductVersion(
    product: PlatformIdentifier!
    version: String!
    """
    Publication date of the release (the `published_at` of the GitHub release),
    used as the creation date of its news feed item. An ISO 8601 date-time with
    an explicit `Z` or `±hh:mm` offset, not more than 5 minutes ahead of the
    Hub's clock. Defaults to the time of the call.
    """
    releasedAt: Date
  ): Success!
}
