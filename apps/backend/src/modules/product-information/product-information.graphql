type SaasPlatformData {
  metadata: SaasPlatformMetadata!
  metrics: SaasPlatformMetrics
  storage: SaasPlatformStorage
}

type SaasPlatformMetadata {
  hostname: String
  plan: String
  start_date: Date
  end_date: Date
  region: String
}

type SaasPlatformMetrics {
  start: Date!
  end: Date!
  resolution: SaasPlatformResolution!
  series: [SaasPlatformMetricSeries!]!
}

type SaasPlatformMetricSeries {
  metric_type: MetricType!
  points: [SaasPlatformMetricPoint!]!
}

type SaasPlatformMetricPoint {
  timestamp: Date!
  value: Float
}

type SaasPlatformStorage {
  es_used_size: SaasPlatformStorageUsage
  s3_used_size: SaasPlatformStorageUsage
}

type SaasPlatformStorageUsage {
  percent: Float
  used: Float
  limit: Float
  time: Date!
}

enum MetricType {
  sla_availability
  sla_response_time
  es_used_size
  s3_used_size
}

enum SaasPlatformResolution {
  hour
  day
}

type Query {
  registeredSaasPlatformData(input: RegisteredPlatformInput!): SaasPlatformData
    @auth(portalCapa: [BYPASS, READ_SAAS_METRICS])
}
