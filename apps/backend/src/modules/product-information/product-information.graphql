type SaasPlatformData {
  metadata: SaasPlatformMetadata!
  metrics: SaasPlatformMetrics
  storage: SaasPlatformStorage
  # null without metrics or without any sla_availability series.
  sla: SaasPlatformSla
}

type SaasPlatformSla {
  # The availability the contract commits to, as a ratio (1 is 100 %).
  target: Float!
  # The whole calendar months of the period, the oldest first: the last one is the current month, counted to date.
  months: [SaasPlatformMonthlySla!]!
}

type SaasPlatformMonthlySla {
  # First day of the month, at midnight UTC.
  month: Date!
  # Mean of the sla_availability points of the month, as a ratio (1 is 100 %); null without any point.
  availability: Float
  # Every day of the month, the days to come included, without availability.
  days: [SaasPlatformDailySla!]!
}

type SaasPlatformDailySla {
  # Midnight UTC.
  day: Date!
  # Mean of the sla_availability points of the day, as a ratio (1 is 100 %); null without any point.
  availability: Float
}

type SaasPlatformMetadata {
  hostname: String
  plan: String
  start_date: Date
  end_date: Date
  region: String
}

type SaasPlatformMetrics {
  start: Date!
  end: Date!
  resolution: SaasPlatformResolution!
  series: [SaasPlatformMetricSeries!]!
}

type SaasPlatformMetricSeries {
  metric_type: MetricType!
  points: [SaasPlatformMetricPoint!]!
}

type SaasPlatformMetricPoint {
  timestamp: Date!
  value: Float
}

type SaasPlatformStorage {
  es_used_size: SaasPlatformStorageUsage
  s3_used_size: SaasPlatformStorageUsage
}

type SaasPlatformStorageUsage {
  percent: Float
  used: Float
  limit: Float
}

enum MetricType {
  sla_availability
  sla_response_time
  es_used_size
  s3_used_size
}

enum SaasPlatformResolution {
  hour
  day
}

enum SaasPlatformMetricsPeriod {
  last_30_days
  last_90_days
  last_180_days
}

# A platform as listed by the SaaS Manager.
type SaasPlatform {
  id: String!
  status: String
  product: String
  customer: String
  commercial_model: String
  sla_cmtd: Float
  metadata: SaasPlatformMetadata!
  storage: SaasPlatformStorage
  # The active SaaS registration of the platform in the Hub, matched on its platform_id; null when it is not registered.
  registered_platform: RegisteredPlatform
}

# A page of the platforms, as the SaaS Manager pages them.
type SaasPlatformPage {
  totalCount: Int!
  # The platforms the SaaS Manager cannot tell apart, without an id, are left out.
  platforms: [SaasPlatform!]!
}

# The fields the SaaS Manager can order the platforms by, named as it expects them: it silently ignores any other.
# The customer is a relation, ordered by its name.
enum SaasPlatformOrdering {
  customer__name
  hostname
  product
  plan
  region
}

input RegisteredSaasPlatformDataInput {
  service_instance_id: ServiceInstanceId!
  metrics_period: SaasPlatformMetricsPeriod!
}

type Query {
  registeredSaasPlatformData(
    input: RegisteredSaasPlatformDataInput!
  ): SaasPlatformData @auth(portalCapa: [BYPASS, READ_SAAS_METRICS])
  # The platforms the SaaS Manager knows, paged, searched and ordered by it; null when it cannot be reached.
  saasManagerPlatforms(
    # From 1.
    page: Int!
    # At most 500.
    pageSize: Int!
    orderBy: SaasPlatformOrdering!
    orderMode: OrderingMode!
    searchTerm: String
  ): SaasPlatformPage @auth(portalCapa: [BYPASS, READ_SAAS_METRICS])
}
