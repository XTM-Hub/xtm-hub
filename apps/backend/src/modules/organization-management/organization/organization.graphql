enum OrganizationOrdering {
  name
}

scalar OrganizationId

type OrganizationRef implements Node {
  id: ID!
}

type Organization implements Node {
  id: ID!
  name: String!
  domains: [String!]
  personal_space: Boolean!
  capabilityUser: [Capability]
  administrator_emails: [String!]
    @auth(portalCapa: [BYPASS, READ_SAAS_METRICS, READ_ORGANIZATION_MEMBERS])
  """
  Members of the organization, invited and disabled users included, pending requests excluded.
  Nullable: a refused read answers null without failing the whole query.
  """
  members_count: Int @auth(portalCapa: [BYPASS, READ_ORGANIZATION_MEMBERS])
}

type OrganizationEdge {
  cursor: String!
  node: Organization!
}

type OrganizationConnection {
  totalCount: Int!
  edges: [OrganizationEdge!]!
  pageInfo: PageInfo!
}

"""
A member of an organization, whatever their status: invited, expired, waiting for validation or disabled.
"""
type OrganizationMember {
  id: UserId!
  email: String!
  first_name: String
  last_name: String
  "Their capabilities in this organization, empty when they hold none."
  capabilities: [OrganizationCapability!]!
}

type OrganizationMemberEdge {
  cursor: String!
  node: OrganizationMember!
}

type OrganizationMemberConnection {
  totalCount: Int!
  edges: [OrganizationMemberEdge!]!
  pageInfo: PageInfo!
}

type Query {
  organization(id: ID!): Organization
    @auth(portalCapa: [BYPASS, READ_ORGANIZATION_MEMBERS])
  organizations(
    first: Int = 50
    after: ID
    orderBy: OrganizationOrdering!
    orderMode: OrderingMode!
    searchTerm: String
  ): OrganizationConnection!
    @auth(portalCapa: [BYPASS, READ_ORGANIZATION_MEMBERS])
  userOrganizations: [Organization!]! @auth
  """
  The members of an organization, administrators first, then by email. Pending requests are not members.
  An organization whose members the caller may not read is refused with ORGANIZATION_NOT_FOUND, as an unknown one.
  """
  organizationMembers(
    organizationId: OrganizationId!
    "The page size, brought down to 100. 0 returns no member but the totalCount; a negative one is refused with INVALID_PAGE_SIZE."
    first: Int!
    after: ID
    "Matches the email, the first name or the last name, ignoring case."
    searchTerm: String
  ): OrganizationMemberConnection! @auth
}

input OrganizationInput {
  name: String!
  domains: [String!]
}

type Mutation {
  addOrganization(input: OrganizationInput!): Organization
    @auth(portalCapa: [BYPASS])
  editOrganization(id: ID!, input: OrganizationInput!): Organization
    @auth(portalCapa: [BYPASS])
  deleteOrganization(id: ID!): Organization @auth(portalCapa: [BYPASS])
}
