enum OrganizationOrdering {
  name
}

scalar OrganizationId

type OrganizationRef implements Node {
  id: ID!
}

type Organization implements Node {
  id: ID!
  name: String!
  domains: [String!]
  personal_space: Boolean!
  capabilityUser: [Capability]
  administrator_emails: [String!]
    @auth(portalCapa: [BYPASS, READ_SAAS_METRICS, READ_ORGANIZATION_MEMBERS])
  """
  Members of the organization, invited and disabled users included, pending requests excluded.
  Nullable: a refused read answers null without failing the whole query.
  """
  members_count: Int @auth(portalCapa: [BYPASS, READ_ORGANIZATION_MEMBERS])
}

type OrganizationEdge {
  cursor: String!
  node: Organization!
}

type OrganizationConnection {
  totalCount: Int!
  edges: [OrganizationEdge!]!
  pageInfo: PageInfo!
}

type Query {
  organization(id: ID!): Organization
    @auth(portalCapa: [BYPASS, READ_ORGANIZATION_MEMBERS])
  organizations(
    first: Int = 50
    after: ID
    orderBy: OrganizationOrdering!
    orderMode: OrderingMode!
    searchTerm: String
  ): OrganizationConnection!
    @auth(portalCapa: [BYPASS, READ_ORGANIZATION_MEMBERS])
  userOrganizations: [Organization!]! @auth
}

input OrganizationInput {
  name: String!
  domains: [String!]
}

type Mutation {
  addOrganization(input: OrganizationInput!): Organization
    @auth(portalCapa: [BYPASS])
  editOrganization(id: ID!, input: OrganizationInput!): Organization
    @auth(portalCapa: [BYPASS])
  deleteOrganization(id: ID!): Organization @auth(portalCapa: [BYPASS])
}
