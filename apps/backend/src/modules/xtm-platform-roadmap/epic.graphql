enum Timeline {
  now
  next
  under_consideration
  finished
}
enum EditionType {
  community_edition
  enterprise_edition
  partial_ee
}

enum EpicType {
  other
  integration
}

type Epic implements Node {
  id: ID!
  title: String!
  short_description: String!
  description: String!
  problem_to_solve: String!
  proposed_solution: String!
  expected_value: String!
  edition_type: EditionType!
  active: Boolean!
  products: [FiligranProduct!]!
  slack_link: String
  timeline: Timeline!
  epic_type: EpicType!
  created_at: Date!
  updated_at: Date
}

input CreateEpicInput {
  title: String!
  short_description: String!
  description: String!
  problem_to_solve: String!
  proposed_solution: String!
  expected_value: String!
  edition_type: EditionType!
  active: Boolean
  products: [FiligranProduct!]!
  slack_link: String
  timeline: Timeline!
  is_integration: Boolean
}

input UpdateEpicInput {
  title: String
  short_description: String
  description: String
  problem_to_solve: String
  proposed_solution: String
  expected_value: String
  edition_type: EditionType!
  active: Boolean
  products: [FiligranProduct!]
  slack_link: String
  timeline: Timeline
  is_integration: Boolean
}

type EpicCountPerTimeline {
  timeline: Timeline!
  count: Int!
}

type EpicEdge {
  cursor: String!
  node: Epic!
}
type EpicConnection {
  totalCount: Int!
  edges: [EpicEdge!]!
  pageInfo: PageInfo!
}
enum EpicOrdering {
  title
}
type Query {
  epics(
    first: Int!
    after: ID
    orderBy: EpicOrdering!
    orderMode: OrderingMode!
    searchTerm: String
  ): EpicConnection
  countEpicsPerTimeline: [EpicCountPerTimeline!]!
}

type Mutation {
  createEpic(input: CreateEpicInput!): Epic! @auth
  updateEpic(id: ID!, input: UpdateEpicInput!): Epic! @auth
  deleteEpic(id: ID!): Epic @auth
}
