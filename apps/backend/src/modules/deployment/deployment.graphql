scalar DeploymentRequestId

enum DeploymentRequestPlatformRegion {
  eu_west
  us_east
  apac_au
  apac_sg
}

enum DeploymentRequestDeploymentType {
  trial
  bundle
}

enum DeploymentRequestHubStatus {
  queued
  pending
  provisioning
  active
  expired
  failed
  cancelled
}

enum DeploymentRequestPlatformState {
  unprovisioned
  provisioning
  active
  removing
  removed
}

enum DeploymentRequestSource {
  xtmhub
  opencti_demo
  openaev_demo
}

enum DeploymentRequestUseCase {
  threat_profiling_cti
  threat_profiling_fimi
  threat_profiling_faml
  threat_profiling_leo
  threat_hunting
  technical_reporting
  strategic_reporting
  incident_response
  security_stack
  detection_engineering
  attack_simulation
  crisis_simulation
  vulnerability_management
  centralizing_knowledge
  sharing_knowledge
  hosting_threat_community
  oaev_attack_simulation
  oaev_penetration_testing
  oaev_atomic_testing
  oaev_platform_validation
  oaev_tabletop_exercise
  oaev_purple_team
  oaev_opencti_coverage
  oaev_ctem_framework
}

enum DeploymentRequestActivitySector {
  computer_network_security
  computer_games
  computer_software
  defense_space
  entertainment
  financial_services
  government_administration
  government_relations
  higher_education
  hospital_health_care
  hospitality
  information_technology
  insurance
  legal_services
  luxury_goods_jewelry
  management_consulting
  marketing_advertising
  military
  non_profit
  oil_energy
  pharmaceuticals
  photography
  retail
  security_investigations
  semiconductors
  telecommunications
  transportation
  utilities
  wireless
}

enum DeploymentRequestJobTitle {
  ceo
  ciso_cso_cio
  c_level
  general_manager_vp
  director_head_cybersecurity
  cybersecurity_team_lead
  application_security_specialist
  cloud_security_specialist
  cybersecurity_architect
  cybersecurity_engineer
  dfir_specialist
  grc_specialist
  iam_specialist
  penetration_tester
  soc_analyst
  threat_intelligence_analyst
  vulnerability_analyst
  consultant
  other
}

type DeploymentRequest implements Node {
  id: ID!
  platform_identifier: PlatformIdentifier
  region: DeploymentRequestPlatformRegion!
  type: DeploymentRequestDeploymentType!
  job_title: DeploymentRequestJobTitle
  activity_sector: DeploymentRequestActivitySector
  use_case: DeploymentRequestUseCase
  start_date: Date
  end_date: Date
  hub_status: DeploymentRequestHubStatus!
  ordering: Int!
  requester_email: String
  organization_requester_id: OrganizationId!
  service_instance_id: ServiceInstanceId!
  organization_name: String
  request_date: Date!
  counts_in_orga_quota: Boolean!
  cancellation_date: Date
  cancellation_user_email: String
  cancellation_reason: String
  platform_id: String
  platform_url: String
  parent_id: DeploymentRequestId
  url: String
  registered_platform: RegisteredPlatform
  service_instance: ServiceInstance
  children: [DeploymentRequest!]
}

type PlatformDeploymentRequest {
  id: ID!
  platform_identifier: PlatformIdentifier
  region: DeploymentRequestPlatformRegion!
  type: DeploymentRequestDeploymentType!
  platform_token: String!
  hub_status: DeploymentRequestHubStatus!
  target_state: DeploymentRequestPlatformState
  actual_state: DeploymentRequestPlatformState
  ordering: Int!
  start_date: Date
  end_date: Date
  job_title: DeploymentRequestJobTitle
  activity_sector: DeploymentRequestActivitySector
  use_case: DeploymentRequestUseCase
  organization_name: String!
  organization_domains: [String!]
  requester_email: String!
  requester_first_name: String
  requester_last_name: String
  platform_id: String
  platform_url: String
  failure_reason: String
  #  parent_id should not be base64 encoded, so let's keep it as a String instead of DeploymentRequestId
  parent_id: String
  url: String
}

input CreateDeploymentRequestInput {
  products: [PlatformIdentifier!]!
  use_cases_by_product: [ProductUseCaseInput!]
  region: DeploymentRequestPlatformRegion!
  type: DeploymentRequestDeploymentType!
  job_title: DeploymentRequestJobTitle
  activity_sector: DeploymentRequestActivitySector
  source: DeploymentRequestSource!
}

input ProductUseCaseInput {
  platform_identifier: PlatformIdentifier!
  use_case: DeploymentRequestUseCase!
}

input UpdateDeploymentRequestInput {
  id: DeploymentRequestId!
  start_date: Date
  end_date: Date
  platform_id: String
  failure_reason: String
  actual_state: DeploymentRequestPlatformState
  ordering: Int
  url: String
}

enum DeploymentRequestFilterKey {
  region
  type
  hub_status
  target_state
  actual_state
  platform_identifier
  parent_id
}

input DeploymentRequestFilter {
  key: DeploymentRequestFilterKey
  value: [String!]!
}

type DeploymentRequestEdge {
  cursor: String!
  node: DeploymentRequest!
}
type PlatformDeploymentRequestEdge {
  cursor: String!
  node: PlatformDeploymentRequest!
}

type DeploymentRequestConnection {
  totalCount: Int!
  edges: [DeploymentRequestEdge!]!
  pageInfo: PageInfo!
}

type PlatformDeploymentRequestConnection {
  totalCount: Int!
  edges: [PlatformDeploymentRequestEdge!]!
  pageInfo: PageInfo!
}

type DeploymentAvailability {
  id: ID!
  region: DeploymentRequestPlatformRegion!
  availableCount: Int!
  capacity: Int!
  platform_identifier: PlatformIdentifier
}

type XtmoneIntegrationStatusEntry {
  status: String!
  connected: Boolean!
  last_checked_at: String
}

type XtmoneIntegrationStatus {
  opencti: XtmoneIntegrationStatusEntry!
  openaev: XtmoneIntegrationStatusEntry!
  linked: Boolean!
  last_checked_at: String
}

type DeployedPlatform {
  serviceInstanceId: ServiceInstanceId!
  platformIdentifier: PlatformIdentifier!
}

type TrialsDeployments {
  availableTrials: [PlatformIdentifier!]!
  deployed: [DeployedPlatform!]!
  isBlacklisted: Boolean!
}

type PlatformTrialStatus {
  isBlacklisted: Boolean!
  hub_status: DeploymentRequestHubStatus
  end_date: Date
  ongoingStandaloneTrials: [PlatformIdentifier!]!
}

enum DeploymentRequestOrdering {
  requester_email
  organization_name
  start_date
  end_date
  hub_status
  region
  ordering
  request_date
  cancellation_date
  cancellation_user_email
  cancellation_reason
}

enum ReorderDeploymentRequestInQueueDirection {
  top
  up
}

input ReorderDeploymentRequestInQueueInput {
  id: DeploymentRequestId!
  direction: ReorderDeploymentRequestInQueueDirection!
}

input UpdateDeploymentQuotaCapacityInput {
  platformIdentifier: PlatformIdentifier
  region: DeploymentRequestPlatformRegion!
  newCapacity: Int!
}

input TrialDeploymentsInput {
  organizationId: OrganizationId!
  platformIdentifiers: [PlatformIdentifier!]
}

extend type Query {
  deploymentRequests(
    first: Int!
    after: ID
    filters: [DeploymentRequestFilter!]
  ): PlatformDeploymentRequestConnection!
    @system_token(portalCapa: [MANAGE_DEPLOYMENT])
  deploymentRequestsAvailable(
    platformIdentifier: PlatformIdentifier
  ): [DeploymentAvailability!]!
    @auth(
      portalCapa: [BYPASS, READ_TRIALS]
      orgaCapa: [ADMINISTRATE_ORGANIZATION, MANAGE_PLATFORM_REGISTRATION]
    )
  deploymentRequestsList(
    first: Int!
    after: ID
    filters: [DeploymentRequestFilter!]
    orderBy: DeploymentRequestOrdering!
    orderMode: OrderingMode!
    searchTerm: String
  ): DeploymentRequestConnection! @auth(portalCapa: [BYPASS, READ_TRIALS])
  trialDeployments(input: TrialDeploymentsInput!): TrialsDeployments! @auth
  platformTrialStatus(organizationId: OrganizationId!): PlatformTrialStatus!
    @auth
  xtmPlatformBundle: DeploymentRequest @auth
  xtmonePlatformIntegrationStatus(
    serviceInstanceId: ServiceInstanceId!
  ): XtmoneIntegrationStatus @auth
}

extend type Mutation {
  createDeploymentRequest(
    input: CreateDeploymentRequestInput!
  ): DeploymentRequest!
    @auth(orgaCapa: [ADMINISTRATE_ORGANIZATION, MANAGE_PLATFORM_REGISTRATION])
  updateDeploymentRequest(
    input: UpdateDeploymentRequestInput!
  ): PlatformDeploymentRequest! @system_token(portalCapa: [MANAGE_DEPLOYMENT])
  reorderDeploymentRequestInQueue(
    input: ReorderDeploymentRequestInQueueInput!
  ): Success! @auth(portalCapa: [BYPASS, MODIFY_TRIALS])
  cancelDeploymentRequest(
    deploymentRequestId: DeploymentRequestId!
    cancellationReason: String
  ): DeploymentRequest
    @auth(orgaCapa: [ADMINISTRATE_ORGANIZATION, MANAGE_PLATFORM_REGISTRATION])
  adminCancelDeploymentRequest(
    deploymentRequestId: DeploymentRequestId!
  ): DeploymentRequest @auth(portalCapa: [BYPASS, MODIFY_TRIALS])
  updateDeploymentQuotaCapacity(
    input: UpdateDeploymentQuotaCapacityInput!
  ): Success! @auth(portalCapa: [BYPASS, MODIFY_TRIALS_QUOTA])
}
