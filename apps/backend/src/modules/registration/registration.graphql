enum PlatformContract {
  CE
  EE
  trial
}

type RegisteredPlatform implements Node {
  id: ID!
  service_instance_id: ServiceInstanceId!
  url: String!
  title: String!
  contract: PlatformContract!
  platform_id: String!
  tenant_id: String
  tenant_name: String
  identifier: ServiceDefinitionIdentifier!
  version: String
  illustration_document_id: DocumentId
  deployment_request: DeploymentRequest
  last_connectivity_check: Date
  status: PlatformConfigurationStatus
  commercial_model: CommercialModel
  subscription: SubscriptionModel
  myGroups: [ServiceGroup!]
  organization: Organization
}

input PlatformInput {
  id: ID!
  url: String!
  title: String!
  contract: PlatformContract!
  version: String
  tenantId: String
  tenantName: String
}

enum PlatformIdentifier {
  opencti
  openaev
  xtmone
}

input RegisterPlatformInput {
  organizationId: ID!
  platform: PlatformInput!
  identifier: PlatformIdentifier!
}

input CanUnregisterPlatformInput {
  platformId: String!
  tenantId: String
}

type RegistrationResponse {
  token: String!
}

enum PlatformRegistrationStatus {
  registered
  unregistered
  never_registered
}

input IsPlatformRegisteredInput {
  platformId: String!
  tenantId: String
}

type IsPlatformRegisteredOrganization implements Node {
  id: ID!
}

type IsPlatformRegisteredResponse {
  status: PlatformRegistrationStatus!
  platformTitle: String
  organization: IsPlatformRegisteredOrganization
}

type CanUnregisterResponse {
  isPlatformRegistered: Boolean!
  isAllowed: Boolean
  isInOrganization: Boolean
  organizationId: OrganizationId
  organizationName: String
}

input UnregisterPlatformInput {
  platformId: String!
  identifier: PlatformIdentifier!
  tenantId: String
}

enum PlatformRegistrationConnectivityStatus {
  active
  inactive
  not_found
}

input RefreshPlatformRegistrationConnectivityStatusInput {
  platformId: String!
  token: String!
  platformVersion: String!
  platformIdentifier: PlatformIdentifier
  platformContract: PlatformContract
}

input RefreshPlatformRegistrationConnectivityStatusSingleTenantInput {
  platformId: String!
  token: String!
  platformVersion: String!
  url: String!
  tenantId: String!
  tenantName: String!
  platformIdentifier: PlatformIdentifier!
  platformContract: PlatformContract
}

input TenantDetails {
  tenantId: String!
  tenantName: String!
  token: String!
  url: String!
}

input RefreshPlatformRegistrationConnectivityStatusAllTenantsInput {
  platformId: String!
  platformVersion: String!
  platformIdentifier: PlatformIdentifier!
  platformContract: PlatformContract
  tenants: [TenantDetails!]!
}

type RefreshPlatformRegistrationConnectivityStatusResponse {
  status: PlatformRegistrationConnectivityStatus!
  commercialModel: CommercialModel
}

type TenantStatus {
  tenantId: String!
  status: PlatformRegistrationConnectivityStatus!
  commercialModel: CommercialModel
}

type RefreshPlatformRegistrationConnectivityStatusAllTenantsResponse {
  statuses: [TenantStatus!]!
}

type RefreshUserPlatformTokenResponse {
  token: String!
}

input RegisteredPlatformsInput {
  identifier: PlatformIdentifier
  onlyActive: Boolean
  onlyTrial: Boolean
  hasDeployedResources: Boolean
}

input RegisteredPlatformInput {
  service_instance_id: ServiceInstanceId!
}

input RegisteredPlatformByPlatformIdInput {
  identifier: PlatformIdentifier!
  platformId: String!
  tenantId: String
}

input AutoRegisterPlatformInput {
  platform: PlatformInput!
  existing_users_count: Int
}

"""
How a registration authenticates to the Hub. More kinds are expected, so a client must accept a value it does not know.
"""
enum RegisteredPlatformCredentialKind {
  token
  none
}

"""
The current credential of a registration. It says which credential exists, never its value.
"""
type RegisteredPlatformCredential {
  kind: RegisteredPlatformCredentialKind!
  has_token: Boolean!
}

type AdminRegisteredPlatformOrganization {
  id: OrganizationId!
  name: String!
}

type AdminRegisteredPlatformRegisterer {
  id: UserId!
  email: String!
  first_name: String
  last_name: String
}

type AdminRegisteredPlatform {
  service_instance_id: ServiceInstanceId!
  platform_id: String!
  title: String!
  url: String!
  identifier: PlatformIdentifier!
  version: String
  contract: PlatformContract!
  commercial_model: CommercialModel!
  tenant_id: String
  tenant_name: String
  status: PlatformConfigurationStatus!
  last_connectivity_check: Date
  "The organization owning the registration: the one of its newest subscription."
  organization: AdminRegisteredPlatformOrganization
  registerer: AdminRegisteredPlatformRegisterer
  credential: RegisteredPlatformCredential!
}

type AdminRegisteredPlatformEdge {
  cursor: String!
  node: AdminRegisteredPlatform!
}

type AdminRegisteredPlatformConnection {
  totalCount: Int!
  edges: [AdminRegisteredPlatformEdge!]!
  pageInfo: PageInfo!
}

enum AdminRegisteredPlatformOrdering {
  title
  last_connectivity_check
  organization_name
}

input AdminRegisteredPlatformsFilter {
  identifier: PlatformIdentifier
  status: PlatformConfigurationStatus
  organizationId: OrganizationId
  hasToken: Boolean
}

type Query {
  isPlatformRegistered(
    input: IsPlatformRegisteredInput!
  ): IsPlatformRegisteredResponse! @auth
  canUnregisterPlatform(
    input: CanUnregisterPlatformInput!
  ): CanUnregisterResponse! @auth
  registeredPlatform(input: RegisteredPlatformInput!): RegisteredPlatform @auth
  registeredPlatformByPlatformId(
    input: RegisteredPlatformByPlatformIdInput!
  ): RegisteredPlatform @auth
  registeredPlatforms(input: RegisteredPlatformsInput!): [RegisteredPlatform!]!
    @auth
  platformAssociatedOrganization(
    platformId: String!
    tenantId: String
  ): Organization @auth
  "Every platform registration, whatever its organization. searchTerm matches the title, URL, ids, tenant, organization and registerer."
  adminRegisteredPlatforms(
    first: Int!
    after: ID
    orderBy: AdminRegisteredPlatformOrdering
    orderMode: OrderingMode
    searchTerm: String
    filter: AdminRegisteredPlatformsFilter
  ): AdminRegisteredPlatformConnection!
}

type Mutation {
  registerPlatform(input: RegisterPlatformInput!): RegistrationResponse! @auth
  unregisterPlatform(input: UnregisterPlatformInput!): Success! @auth
  "Unregisters a platform without being a member of its organization. Does nothing on an inactive registration."
  adminUnregisterPlatform(
    serviceInstanceId: ServiceInstanceId!
  ): AdminRegisteredPlatform!
  refreshUserPlatformToken: RefreshUserPlatformTokenResponse! @auth
  # Warning ! Used by OpenCTI
  refreshPlatformRegistrationConnectivityStatus(
    input: RefreshPlatformRegistrationConnectivityStatusInput!
  ): RefreshPlatformRegistrationConnectivityStatusResponse!
  # Warning ! Used by OpenAEV
  refreshPlatformRegistrationConnectivityStatusSingleTenant(
    input: RefreshPlatformRegistrationConnectivityStatusSingleTenantInput!
  ): RefreshPlatformRegistrationConnectivityStatusResponse!
  # Warning ! Used by OpenAEV
  refreshPlatformRegistrationConnectivityStatusAllTenants(
    input: RefreshPlatformRegistrationConnectivityStatusAllTenantsInput!
  ): RefreshPlatformRegistrationConnectivityStatusAllTenantsResponse!
  # Warning ! Used by OpenCTI and OpenAEV (trials)
  autoRegisterPlatform(
    platform: PlatformInput @deprecated(reason: "Use input instead")
    input: AutoRegisterPlatformInput
  ): Success! @platform_token
}
