scalar NewsFeedItemId

enum NewsFeedItemType {
  RESOURCE_CUSTOM_DASHBOARD
  RESOURCE_PLAYBOOK
  RESOURCE_CUSTOM_VIEW
  RESOURCE_INTEGRATION
  RESOURCE_SCENARIO
  BLOG_POST
}

# The utm_medium that the Hub gives to every news feed link. The frontend reads it to recognize a news feed redirect
enum NewsFeedUtmMedium {
  newsfeed
}

# Mirrors the utm_content values that the Hub gives to the news feed links (newsFeedUtmContentMapping and its fallback)
enum NewsFeedUtmContent {
  blog_posts
  custom_dashboard
  custom_view
  integration
  playbook
  scenario
  other
}

enum NewsFeedItemMetadataKey {
  url_path
  document_id
  blog_post_slug
  description
  image_url
  image_alt
  author_names
  read_minutes
}

type NewsFeedItemMetadata {
  key: NewsFeedItemMetadataKey!
  value: String
}

# Warning ! Used by OpenCTI, should be used by XTM Hub because of ID conflicts
type ProvisionedNewsFeedItem implements Node {
  id: ID!
  is_deleted: Boolean!
  title: String!
  type: NewsFeedItemType!
  tags: [String!]!
  metadata: [NewsFeedItemMetadata!]!
  creation_date: Date!
}

type ConsumeProvisionedNewsFeedItemsResponse {
  news_feed_items: [ProvisionedNewsFeedItem!]!
  available_news_feed_types: [NewsFeedItemType!]!
}

type NewsFeedItem implements Node {
  id: ID!
  title: String!
  type: NewsFeedItemType!
  creation_date: Date!
  tags: [String!]!
  is_deleted: Boolean!
  metadata: [NewsFeedItemMetadata!]!
}

type NewsFeedItemEdge {
  cursor: String!
  node: NewsFeedItem!
}

type NewsFeedItemConnection {
  totalCount: Int!
  edges: [NewsFeedItemEdge!]!
  pageInfo: PageInfo!
}

extend type Query {
  newsFeedItems(first: Int!, after: ID): NewsFeedItemConnection!
    @auth(portalCapa: BYPASS)
}

type Mutation {
  # Warning ! Used by OpenCTI
  consumeProvisionedNewsFeedItems: ConsumeProvisionedNewsFeedItemsResponse!
    @platform_token
  deleteNewsFeedItem(id: NewsFeedItemId!): Boolean! @auth(portalCapa: BYPASS)
}
