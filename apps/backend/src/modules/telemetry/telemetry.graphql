type TelemetryResponse {
  result: Boolean!
  message: String
}

input OneClickDeployInput {
  platform_identifier: PlatformIdentifier!
  service_instance_id: ServiceInstanceId!
  resource_id: DocumentId!
  resource_title: String!
  platform_service_instance_id: ID!
}

# Best-effort analytics from the query string of a news feed link to a resource
input NewsFeedRedirectInput {
  service_identifier: ServiceDefinitionIdentifier!
  resource_id: DocumentId
  platform_id: String
  platform_identifier: PlatformIdentifier
  utm_content: NewsFeedUtmContent
}

type SendTelemetryMutation {
  oneClickDeploy(input: OneClickDeployInput!): TelemetryResponse
  newsFeedRedirect(input: NewsFeedRedirectInput!): TelemetryResponse
}

extend type Mutation {
  sendTelemetryEvent: SendTelemetryMutation @auth
}
