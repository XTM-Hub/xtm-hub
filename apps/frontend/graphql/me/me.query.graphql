query meCheck {
  me {
    id
  }
}

query MeFirstName {
  me {
    first_name
  }
}

query MeOrganizationDomains {
  me {
    organizations {
      id
      domains
    }
  }
}

query MeOrganizations {
  me {
    id
    selected_organization_id
    organizations {
      id
      name
      personal_space
    }
  }
}

query MeAnalytics {
  me {
    email
    selected_organization_id
    organizations {
      id
      personal_space
    }
    capabilities {
      name
    }
    selected_org_capabilities
  }
}
