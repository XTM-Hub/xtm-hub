fragment CurrentUser on User {
  id
  email
  first_name
  last_name
  country
  picture
  selected_organization_id
  capabilities {
    name
  }
  organizations {
    id
    name
    personal_space
  }
  selected_org_capabilities
  has_replied_satisfaction
}

query meCheck {
  me {
    id
  }
}

query MeFirstName {
  me {
    first_name
  }
}

query MeOrganizationDomains {
  me {
    organizations {
      id
      domains
    }
  }
}

query MeOrganizations {
  me {
    id
    selected_organization_id
    organizations {
      id
      name
      personal_space
    }
  }
}

query MeAnalytics {
  me {
    email
    selected_organization_id
    organizations {
      id
      personal_space
    }
    capabilities {
      name
    }
    selected_org_capabilities
  }
}

query Me {
  me {
    ...CurrentUser
  }
}
