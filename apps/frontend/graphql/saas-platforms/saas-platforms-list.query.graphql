fragment SaasPlatformRow on SaasPlatform {
  id
  product
  customer
  metadata {
    plan
    end_date
  }
  registered_platform {
    id
    service_instance_id
    identifier
    version
    organization {
      id
      name
      administrator_emails
    }
  }
}

query SaasManagerPlatformsList(
  $page: Int!
  $pageSize: Int!
  $orderBy: SaasPlatformOrdering!
  $orderMode: OrderingMode!
  $searchTerm: String
) {
  saasManagerPlatforms(
    page: $page
    pageSize: $pageSize
    orderBy: $orderBy
    orderMode: $orderMode
    searchTerm: $searchTerm
  ) {
    totalCount
    platforms {
      ...SaasPlatformRow
    }
  }
}
