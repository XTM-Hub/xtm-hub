fragment OrganizationItem on Organization {
  id
  name
  domains
  personal_space
}

query OrganizationsList(
  $count: Int
  $cursor: ID
  $orderBy: OrganizationOrdering!
  $orderMode: OrderingMode!
  $searchTerm: String
) {
  organizations(
    first: $count
    after: $cursor
    orderBy: $orderBy
    orderMode: $orderMode
    searchTerm: $searchTerm
  ) {
    totalCount
    edges {
      node {
        ...OrganizationItem
      }
    }
  }
}

query OrganizationsAdminList(
  $count: Int
  $cursor: ID
  $orderBy: OrganizationOrdering!
  $orderMode: OrderingMode!
  $searchTerm: String
) {
  organizations(
    first: $count
    after: $cursor
    orderBy: $orderBy
    orderMode: $orderMode
    searchTerm: $searchTerm
  ) {
    totalCount
    edges {
      node {
        ...OrganizationItem
        administrator_emails
        members_count
      }
    }
  }
}

query UserOrganizations {
  userOrganizations {
    id
    name
    personal_space
  }
}

query OrganizationMembers(
  $organizationId: OrganizationId!
  $first: Int!
  $after: ID
  $searchTerm: String
) {
  organizationMembers(
    organizationId: $organizationId
    first: $first
    after: $after
    searchTerm: $searchTerm
  ) {
    totalCount
    edges {
      node {
        id
        email
        first_name
        last_name
        capabilities
      }
    }
  }
}
