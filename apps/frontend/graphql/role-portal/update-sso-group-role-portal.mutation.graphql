mutation UpdateSSOGroupRolePortal(
    $ssoGroup: String!
    $rolePortal: String!
    $input: UpdateSSOGroupRolePortalInput!
) {
    updateSSOGroupRolePortal(
        ssoGroup: $ssoGroup
        rolePortal: $rolePortal
        input: $input
    ) {
        ssoGroup
        rolePortal {
            id
            name
        }
    }
}
