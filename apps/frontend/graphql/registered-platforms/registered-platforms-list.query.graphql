query RegisteredPlatformsList($input: RegisteredPlatformsInput!) {
  registeredPlatforms(input: $input) {
    id
    platform_id
    title
    url
    contract
    identifier
    deployment_request {
      type
      parent_id
    }
    subscription {
      end_date
      start_date
      service_instance {
        id
        name
      }
    }
  }
}
