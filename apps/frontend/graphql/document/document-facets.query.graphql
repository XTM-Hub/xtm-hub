query DocumentFacets($input: LoadDocumentFacetInput!) {
  documentFacets(input: $input) {
    integration_type {
      value
      count
    }
    license_type {
      value
      count
    }
    manager_supported {
      value
      count
    }
    verified {
      value
      count
    }
    solution_category {
      value
      count
    }
    use_case {
      value
      count
    }
    entity_type {
      value
      count
    }
  }
}
