fragment HomepageDocument on Document {
  id
  name
  short_description
  type
  status
  slug
  service_instance_id
  children_documents {
    id
    image_type
  }
  use_cases {
    id
    name
  }
  ... on Connector {
    verified
    manager_supported
  }
}

query MostDeployedDocumentsQuery(
  $limit: Int!
  $platformIdentifiers: [PlatformIdentifier!]
) {
  mostDeployedDocuments(
    limit: $limit
    platformIdentifiers: $platformIdentifiers
  ) {
    ...HomepageDocument
  }
}

query NewestDocumentsQuery(
  $limit: Int!
  $platformIdentifiers: [PlatformIdentifier!]
) {
  newestDocuments(limit: $limit, platformIdentifiers: $platformIdentifiers) {
    ...HomepageDocument
  }
}

query LastDeployedOverviewQuery(
  $limit: Int!
  $serviceInstanceId: ServiceInstanceId!
) {
  lastDeployedOverview(limit: $limit, serviceInstanceId: $serviceInstanceId) {
    resources {
      document {
        ...HomepageDocument
      }
      deployedAt
      deployedBy {
        id
        first_name
        last_name
        email
        picture
      }
    }
  }
}
