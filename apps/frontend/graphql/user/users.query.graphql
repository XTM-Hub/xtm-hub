query Users(
  $first: Int!
  $orderBy: UserOrdering!
  $orderMode: OrderingMode!
  $filters: [Filter!]
  $searchTerm: String
) {
  users(
    first: $first
    orderBy: $orderBy
    orderMode: $orderMode
    filters: $filters
    searchTerm: $searchTerm
  ) {
    edges {
      node {
        id
        email
      }
    }
  }
}
