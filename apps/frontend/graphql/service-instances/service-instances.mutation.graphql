mutation EditSeoServiceInstanceMetadata(
  $service_instance_id: ServiceInstanceId!
  $language: Locale!
  $input: EditSeoServiceInstanceInput!
) {
  editSeoServiceInstance(
    service_instance_id: $service_instance_id
    language: $language
    input: $input
  ) {
    service_instance_id
    language
    meta_title
    meta_description
  }
}
