mutation EditSeoServiceInstanceMetadata(
  $service_instance_id: ServiceInstanceId!
  $language: Locale!
  $input: EditSeoServiceInstanceInput!
) {
  editSeoServiceInstance(
    service_instance_id: $service_instance_id
    language: $language
    input: $input
  ) {
    service_instance_id
    language
    meta_title
    meta_description
  }
}

mutation UpdatePlatformServiceMetadata(
  $input: UpdatePlatformServiceMetadataInput!
) {
  updatePlatformServiceMetadata(input: $input) {
    id
    title
  }
}

mutation AddServicePicture(
  $serviceInstanceId: ServiceInstanceId!
  $document: Upload
  $isLogo: Boolean!
) {
  addServicePicture(
    serviceInstanceId: $serviceInstanceId
    document: $document
    isLogo: $isLogo
  ) {
    id
    name
  }
}
