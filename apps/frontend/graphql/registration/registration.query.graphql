query RegisteredPlatforms($input: RegisteredPlatformsInput!) {
  registeredPlatforms(input: $input) {
    id
    identifier
    title
    contract
    deployment_request {
      parent_id
    }
    subscription {
      start_date
      end_date
      service_instance_id
    }
  }
}

query PlatformAssociatedOrganization($platformId: String!, $tenantId: String) {
  platformAssociatedOrganization(platformId: $platformId, tenantId: $tenantId) {
    id
  }
}

query RegisteredPlatformRedirectTargets($input: RegisteredPlatformsInput!) {
  registeredPlatforms(input: $input) {
    service_instance_id
    platform_id
    tenant_id
    identifier
    deployment_request {
      parent_id
    }
  }
}
