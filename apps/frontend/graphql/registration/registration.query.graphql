query RegisteredPlatforms($input: RegisteredPlatformsInput!) {
  registeredPlatforms(input: $input) {
    id
    identifier
    title
    contract
    subscription {
      start_date
      end_date
      service_instance_id
    }
  }
}

query RegisteredSaasPlatformMetadata($input: RegisteredPlatformInput!) {
  registeredSaasPlatformMetadata(input: $input) {
    hostname
    plan
    start_date
    end_date
    region
  }
}

query RegisteredSaasPlatformMetrics($input: RegisteredPlatformInput!) {
  registeredSaasPlatformMetrics(input: $input) {
    platform_id
    start
    end
    resolution
    series {
      metric_type
      points {
        t
        v
      }
    }
  }
}
