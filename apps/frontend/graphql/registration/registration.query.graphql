query RegisteredPlatforms($input: RegisteredPlatformsInput!) {
  registeredPlatforms(input: $input) {
    id
    identifier
    title
    contract
    subscription {
      start_date
      end_date
      service_instance_id
    }
  }
}

query RegisteredSaasPlatformMetadata($platformId: String!) {
  registeredSaasPlatformMetadata(platformId: $platformId) {
    hostname
    subscribedPlan
    startDate
    endDate
    regionalArea
    platformVersion
  }
}
